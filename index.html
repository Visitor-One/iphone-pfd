<body>
<div id="pfd">
<div id="viewport"><div id="horizon"><div id="pitchLadder"></div></div></div>
<div id="speedTapeBox" class="gpsTape"><div id="speedUnit" class="gpsUnit">km/h</div><div id="speedTape" class="gpsTapeInner"></div><div id="speedCurrent" class="gpsCurrent">---</div></div>
<div id="altitudeTapeBox" class="gpsTape"><div id="altitudeUnit" class="gpsUnit">m</div><div id="altitudeTape" class="gpsTapeInner"></div><div id="altitudeCurrent" class="gpsCurrent">---</div></div>
<div id="headingBox"><div id="headingTape"></div><div id="headingIndex"></div></div><div id="headingPointer"></div>
<div id="rollScale"><div id="rollArc"></div></div><div id="movingBank"><div id="movingBankPointer"></div></div><div id="fixedBankPointer"></div>
<div id="aircraft"><div class="wing left"></div><div id="centerCircle"></div><div class="wing right"></div></div>
<div id="leftControls"><button id="swapButton">P↔R Z/X</button><button id="debugButton">DEBUG</button></div><div id="controls"><button id="startButton">▶ START</button><button id="gpsButton">GPS<br>FREIGABE</button><button id="zeroButton">ZERO</button></div>
<div id="pitchBox" class="dataBox">PITCH&nbsp;<span id="pitchValue">0.0°</span></div>
<div id="rollBox" class="dataBox">ROLL&nbsp;<span id="rollValue">0.0°</span></div>
<div id="headingData" class="dataBox">HDG&nbsp;<span id="headingDataValue">---</span></div>
<div id="status">V7.8</div><div id="debug"></div>
</div>
<script>
const RAD_TO_DEG=180/Math.PI,PX_PER_DEG=7,HORIZON_ZERO_OFFSET_PX=-14,GRAVITY_FILTER=.08,DISPLAY_FILTER=.14,HEADING_FILTER=.10,DEADBAND=.20,MAX_PITCH=60,MAX_ROLL=60;
const SPEED_PX_PER_KMH=4,ALT_PX_PER_METER=2,GPS_DISPLAY_FILTER=.16,MAX_GPS_ALTITUDE_ACCURACY=30,DEM_UPDATE_DISTANCE=100;
const $=id=>document.getElementById(id);
const horizon=$("horizon"),ladder=$("pitchLadder"),pitchValue=$("pitchValue"),rollValue=$("rollValue"),headingDataValue=$("headingDataValue"),headingBox=$("headingBox"),headingTape=$("headingTape"),statusBox=$("status"),debugBox=$("debug"),swapButton=$("swapButton"),movingBank=$("movingBank"),speedTape=$("speedTape"),altitudeTape=$("altitudeTape"),speedCurrent=$("speedCurrent"),altitudeCurrent=$("altitudeCurrent");
let gravity=null,rawPitch=0,rawRoll=0,zeroPitch=0,zeroRoll=0,targetPitch=0,targetRoll=0,displayPitch=0,displayRoll=0;
let rawHeading=0,displayHeading=0,haveHeading=false,compassRaw=null,compassAccuracy=null,alphaDebug=null,headingSource="NONE";
let haveMotion=false,debugVisible=false,swapPitchRoll=true;
let gpsState="IDLE",gpsError="---",gpsPermission="UNKNOWN",gpsLatitude=null,gpsLongitude=null,gpsHorizontalAccuracy=null,gpsSpeed=null,gpsAltitude=null,gpsAltitudeAccuracy=null,gpsWatchId=null,haveSpeed=false,displaySpeed=0;
let demAltitude=null,activeAltitude=null,altitudeSource="NONE",haveAltitude=false,displayAltitude=0,lastDemLatitude=null,lastDemLongitude=null,demRequestRunning=false,demState="IDLE",demError="---";

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function smooth(c,t,f){return c+(t-c)*f}
function smoothAngle(c,t,f){const d=((t-c+540)%360)-180;return(c+d*f+360)%360}
function normalize180(a){while(a>180)a-=360;while(a<-180)a+=360;return a}
function fmt(v,d=1){return v===null||!Number.isFinite(v)?"---":v.toFixed(d)}
function distanceMeters(a,b,c,d){const R=6371000,p1=a*Math.PI/180,p2=c*Math.PI/180,dp=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function filterGravity(x,y,z){if(!gravity){gravity={x,y,z};return}gravity.x+=(x-gravity.x)*GRAVITY_FILTER;gravity.y+=(y-gravity.y)*GRAVITY_FILTER;gravity.z+=(z-gravity.z)*GRAVITY_FILTER}
function getAttitudeAngles(){if(!gravity)return null;const {x,y,z}=gravity,ax=Math.atan2(x,-y)*RAD_TO_DEG,az=Math.atan2(z,-y)*RAD_TO_DEG;return swapPitchRoll?{pitch:az,roll:ax}:{pitch:ax,roll:az}}
function calculateAttitude(){if(!gravity)return;const {x,y,z}=gravity;if(Math.sqrt(x*x+y*y+z*z)<3)return;const a=getAttitudeAngles();rawPitch=a.pitch;rawRoll=a.roll;let p=normalize180(rawPitch-zeroPitch),r=normalize180(rawRoll-zeroRoll);if(Math.abs(p)<DEADBAND)p=0;if(Math.abs(r)<DEADBAND)r=0;targetPitch=clamp(p,-MAX_PITCH,MAX_PITCH);targetRoll=clamp(r,-MAX_ROLL,MAX_ROLL)}
function handleMotion(e){const g=e.accelerationIncludingGravity;if(!g||g.x==null||g.y==null||g.z==null)return;filterGravity(g.x,g.y,g.z);haveMotion=true;calculateAttitude()}

/* Kompasskern aus V6.13 unverändert */
function handleOrientation(e){
 alphaDebug=(typeof e.alpha==="number"&&Number.isFinite(e.alpha))?e.alpha:null;
 if(typeof e.webkitCompassAccuracy==="number"&&Number.isFinite(e.webkitCompassAccuracy))compassAccuracy=e.webkitCompassAccuracy;
 if(typeof e.webkitCompassHeading!=="number"||!Number.isFinite(e.webkitCompassHeading))return;
 compassRaw=(e.webkitCompassHeading+360)%360;rawHeading=compassRaw;headingSource="webkitCompassHeading";
 if(!haveHeading){displayHeading=rawHeading;haveHeading=true}
}

function hasGoodGpsAltitude(){return gpsAltitude!==null&&Number.isFinite(gpsAltitude)&&gpsAltitudeAccuracy!==null&&Number.isFinite(gpsAltitudeAccuracy)&&gpsAltitudeAccuracy<=MAX_GPS_ALTITUDE_ACCURACY}
function setAltitude(a,s){if(a===null||!Number.isFinite(a))return;activeAltitude=a;altitudeSource=s;if(!haveAltitude){displayAltitude=a;haveAltitude=true}}
function shouldUpdateDem(a,b){if(lastDemLatitude===null||lastDemLongitude===null)return true;return distanceMeters(lastDemLatitude,lastDemLongitude,a,b)>=DEM_UPDATE_DISTANCE}
async function requestDemAltitude(a,b){if(demRequestRunning)return;demRequestRunning=true;demState="REQUEST";demError="---";try{const r=await fetch("https://api.open-meteo.com/v1/elevation?latitude="+encodeURIComponent(a)+"&longitude="+encodeURIComponent(b),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();const e=Array.isArray(d.elevation)?Number(d.elevation[0]):Number(d.elevation);if(!Number.isFinite(e))throw new Error("Keine Elevation");demAltitude=e;lastDemLatitude=a;lastDemLongitude=b;demState="OK";if(!hasGoodGpsAltitude())setAltitude(e,"DEM")}catch(e){demState="ERROR";demError=e.message||String(e)}finally{demRequestRunning=false}}

function processGPSPosition(p){
 gpsState="ACTIVE";gpsError="---";gpsPermission="GRANTED";
 const c=p.coords;
 if(Number.isFinite(c.latitude))gpsLatitude=c.latitude;
 if(Number.isFinite(c.longitude))gpsLongitude=c.longitude;
 if(Number.isFinite(c.accuracy))gpsHorizontalAccuracy=c.accuracy;
 if(c.speed!==null&&Number.isFinite(c.speed)){gpsSpeed=Math.max(0,c.speed*3.6);if(!haveSpeed){displaySpeed=gpsSpeed;haveSpeed=true}}
 else if(!haveSpeed){gpsSpeed=0;displaySpeed=0;haveSpeed=true}
 gpsAltitude=c.altitude!==null&&Number.isFinite(c.altitude)?c.altitude:null;
 gpsAltitudeAccuracy=c.altitudeAccuracy!==null&&Number.isFinite(c.altitudeAccuracy)?c.altitudeAccuracy:null;
 if(hasGoodGpsAltitude())setAltitude(gpsAltitude,"GPS");
 else{
   if(Number.isFinite(demAltitude))setAltitude(demAltitude,"DEM");
   if(gpsLatitude!==null&&gpsLongitude!==null&&shouldUpdateDem(gpsLatitude,gpsLongitude))requestDemAltitude(gpsLatitude,gpsLongitude);
 }
 $("gpsButton").textContent="GPS ✓";
}

function processGPSError(e){
 const n=e.code===1?"PERMISSION_DENIED":e.code===2?"POSITION_UNAVAILABLE":e.code===3?"TIMEOUT":"UNKNOWN";
 gpsState="ERROR";gpsError=n+": "+e.message;
 if(e.code===1){gpsPermission="DENIED";$("gpsButton").textContent="GPS GESPERRT"}
 else $("gpsButton").textContent="GPS ERNEUT";
 statusBox.textContent=n;
}

function startGPSWatch(){
 if(!("geolocation" in navigator))return;
 if(gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null}
 gpsWatchId=navigator.geolocation.watchPosition(processGPSPosition,processGPSError,{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
}

/* V6.14: expliziter, direkt durch Benutzeraktion ausgelöster Request */
function requestGPSPermission(){
 if(!window.isSecureContext){gpsState="ERROR";gpsError="HTTPS erforderlich";statusBox.textContent="GPS braucht HTTPS";return}
 if(!("geolocation" in navigator)){gpsState="UNAVAILABLE";gpsError="Geolocation API fehlt";statusBox.textContent="GPS API fehlt";return}
 gpsState="REQUESTING";gpsError="---";$("gpsButton").textContent="GPS …";statusBox.textContent="Standort wird angefragt…";
 navigator.geolocation.getCurrentPosition(
   p=>{processGPSPosition(p);startGPSWatch();statusBox.textContent="GPS aktiv"},
   e=>processGPSError(e),
   {enableHighAccuracy:true,maximumAge:0,timeout:20000}
 );
}

/* Permission API ist nur Diagnose; die eigentliche Freigabe erfolgt über getCurrentPosition(). */
async function probeGPSPermission(){
 if(!navigator.permissions||typeof navigator.permissions.query!=="function"){gpsPermission="API N/A";return}
 try{
   const p=await navigator.permissions.query({name:"geolocation"});
   gpsPermission=(p.state||"unknown").toUpperCase();
   p.onchange=()=>{gpsPermission=(p.state||"unknown").toUpperCase()}
 }catch(e){gpsPermission="API N/A"}
}

function setZero(){if(!haveMotion||!gravity){statusBox.textContent="Keine Sensordaten";return}const a=getAttitudeAngles();zeroPitch=a.pitch;zeroRoll=a.roll;rawPitch=zeroPitch;rawRoll=zeroRoll;targetPitch=targetRoll=displayPitch=displayRoll=0;statusBox.textContent="ZERO gesetzt"}
function swapAxes(){swapPitchRoll=!swapPitchRoll;if(haveMotion&&gravity)setZero();updateSwapButton()}
function updateSwapButton(){swapButton.textContent=swapPitchRoll?"P↔R Z/X":"P↔R X/Z"}

async function startSensors(){
 try{
   statusBox.textContent="Freigaben…";
   /* Standort bewusst NICHT automatisch vor Motion-Dialog anfordern.
      Der GPS-Button bleibt ein eigener echter User-Gesture-Request. */
   if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){
     if(await DeviceMotionEvent.requestPermission()!=="granted"){statusBox.textContent="Motion verweigert";return}
   }
   if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
     let p;try{p=await DeviceOrientationEvent.requestPermission(true)}catch{p=await DeviceOrientationEvent.requestPermission()}
     if(p!=="granted"){statusBox.textContent="Kompass verweigert";return}
   }
   window.addEventListener("devicemotion",handleMotion,true);
   window.addEventListener("deviceorientation",handleOrientation,true);
   $("startButton").style.display="none";statusBox.textContent="Sensoren aktiv";
   setTimeout(()=>{if(haveMotion){setZero();statusBox.textContent="V7.5"}},1500)
 }catch(e){statusBox.textContent="Fehler: "+e.message}
}

const pitchMarks=[-40,-35,-30,-25,-20,-15,-10,-5,5,10,15,20,25,30,35,40];
for(const deg of pitchMarks){const l=document.createElement("div");l.className="pitchLine "+(Math.abs(deg)%10===0?"ten":"five");const y=550-deg*PX_PER_DEG;l.style.top=y+"px";ladder.appendChild(l);const a=Math.abs(deg);if([5,10,15,20,30,40].includes(a)){for(const side of ["left","right"]){const n=document.createElement("div");n.className="pitchLabel";n.textContent=a;n.style.top=(y-9)+"px";if(side==="left")n.style.left="128px";else n.style.right="128px";if(a===5||a===15){n.style.fontSize="11px";n.style.fontWeight="500"}ladder.appendChild(n)}}}
const rollScale=$("rollScale"),rollMarks=[-60,-45,-30,-20,-10,0,10,20,30,45,60];
for(const a of rollMarks){const t=document.createElement("div");t.className="rollTick";if(a===0||Math.abs(a)===30||Math.abs(a)===60)t.classList.add("major");else if(Math.abs(a)===45)t.classList.add("medium");t.style.transform="rotate("+a+"deg)";rollScale.appendChild(t);if(a!==0){const n=document.createElement("div");n.className="rollNumber";n.textContent=Math.abs(a);const r=244,q=a*Math.PI/180;n.style.left="calc(50% + "+Math.sin(q)*r+"px)";n.style.top="calc(50% + "+(-Math.cos(q)*r)+"px)";n.style.marginLeft="-17px";n.style.marginTop="-9px";rollScale.appendChild(n)}}
const HEADING_PX_PER_DEG=3.7;
for(let deg=-360;deg<=720;deg+=5){const n=((deg%360)+360)%360,m=document.createElement("div");m.className="headingMark "+(n%10===0?"ten":"");m.style.left=deg*HEADING_PX_PER_DEG+"px";headingTape.appendChild(m);if(n%30===0){const l=document.createElement("div");l.className="headingLabel";if(n===0){l.textContent="N";l.classList.add("cardinal")}else if(n===90){l.textContent="E";l.classList.add("cardinal")}else if(n===180){l.textContent="S";l.classList.add("cardinal")}else if(n===270){l.textContent="W";l.classList.add("cardinal")}else l.textContent=String(n).padStart(3,"0");l.style.left=deg*HEADING_PX_PER_DEG+"px";headingTape.appendChild(l)}}
for(let s=0;s<=300;s+=5){const t=document.createElement("div");t.className="gpsTick "+(s%10===0?"major":"minor");t.style.top=-s*SPEED_PX_PER_KMH+"px";speedTape.appendChild(t);if(s%10===0){const l=document.createElement("div");l.className="gpsLabel";l.textContent=s;l.style.top=-s*SPEED_PX_PER_KMH+"px";speedTape.appendChild(l)}}
for(let a=-500;a<=5000;a+=10){const t=document.createElement("div");t.className="gpsTick "+(a%20===0?"major":"minor");t.style.top=-a*ALT_PX_PER_METER+"px";altitudeTape.appendChild(t);if(a%20===0){const l=document.createElement("div");l.className="gpsLabel";l.textContent=a;l.style.top=-a*ALT_PX_PER_METER+"px";altitudeTape.appendChild(l)}}

function updateDebug(){
 if(!debugVisible)return;
 const standalone=window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches;
 debugBox.innerHTML="PFD V7.8<br><br><b>CONTEXT</b><br>SECURE: "+(window.isSecureContext?"YES":"NO")+"<br>STANDALONE: "+(standalone?"YES":"NO")+"<br>GEO API: "+(("geolocation"in navigator)?"YES":"NO")+"<br>PERMISSION: "+gpsPermission+"<br><br><b>COMPASS</b><br>SOURCE: "+headingSource+"<br>WEBKIT HDG: "+fmt(compassRaw,1)+"°<br>WEBKIT ACC: "+fmt(compassAccuracy,1)+"°<br>ALPHA (IGNORED): "+fmt(alphaDebug,1)+"°<br>DISPLAY HDG: "+fmt(displayHeading,1)+"°<br><br><b>GPS</b><br>STATE: "+gpsState+"<br>ERROR: "+gpsError+"<br>LAT: "+fmt(gpsLatitude,6)+"<br>LON: "+fmt(gpsLongitude,6)+"<br>GPS ACC: ±"+fmt(gpsHorizontalAccuracy,1)+" m<br>SPEED: "+fmt(gpsSpeed,1)+" km/h<br>GPS ALT: "+fmt(gpsAltitude,1)+" m<br>ALT ACC: ±"+fmt(gpsAltitudeAccuracy,1)+" m<br>DEM: "+fmt(demAltitude,1)+" m<br>ALT SOURCE: "+altitudeSource+"<br><br>MODE: "+(swapPitchRoll?"P=Z / R=X":"P=X / R=Z")+"<br>RAW P: "+rawPitch.toFixed(2)+"°<br>RAW R: "+rawRoll.toFixed(2)+"°"
}

function render(){
 displayPitch=smooth(displayPitch,targetPitch,DISPLAY_FILTER);displayRoll=smooth(displayRoll,targetRoll,DISPLAY_FILTER);
 horizon.style.transform="translateY("+(displayPitch*PX_PER_DEG+HORIZON_ZERO_OFFSET_PX)+"px) rotate("+(-displayRoll)+"deg)";
 movingBank.style.transform="translate(-50%,-50%) rotate("+(-displayRoll)+"deg)";
 pitchValue.textContent=displayPitch.toFixed(1)+"°";rollValue.textContent=displayRoll.toFixed(1)+"°";
 if(haveHeading){displayHeading=smoothAngle(displayHeading,rawHeading,HEADING_FILTER);let h=Math.round(displayHeading)%360;if(h===0)h=360;headingDataValue.textContent=String(h).padStart(3,"0")+"°";headingTape.style.transform="translateX("+(headingBox.clientWidth/2-displayHeading*HEADING_PX_PER_DEG)+"px)"}
 if(haveSpeed&&gpsSpeed!==null){displaySpeed=smooth(displaySpeed,gpsSpeed,GPS_DISPLAY_FILTER);speedCurrent.textContent=Math.round(displaySpeed);speedTape.style.transform="translateY("+(displaySpeed*SPEED_PX_PER_KMH)+"px)"}
 if(haveAltitude&&activeAltitude!==null){displayAltitude=smooth(displayAltitude,activeAltitude,GPS_DISPLAY_FILTER);altitudeCurrent.textContent=Math.round(displayAltitude);altitudeTape.style.transform="translateY("+(displayAltitude*ALT_PX_PER_METER)+"px)"}
 updateDebug();requestAnimationFrame(render)
}
render();

$("startButton").addEventListener("click",startSensors);
$("gpsButton").addEventListener("click", async ()=>{
    if(!("geolocation" in navigator)){
        gpsState="UNAVAILABLE"; gpsError="Geolocation API fehlt";
        statusBox.textContent="GPS API fehlt"; return;
    }

    gpsState="REQUESTING"; gpsError="---";
    $("gpsButton").textContent="GPS …";
    statusBox.textContent=(navigator.standalone===true)?"GPS Standalone…":"GPS Freigabe…";

    const geoPromise=new Promise((resolve,reject)=>{
        navigator.geolocation.getCurrentPosition(
            resolve,reject,
            {enableHighAccuracy:true,maximumAge:0,timeout:10000}
        );
    });

    const watchdog=new Promise((_,reject)=>{
        setTimeout(()=>reject({code:99,message:"IOS_STANDALONE_TIMEOUT"}),12000);
    });

    try{
        const position=await Promise.race([geoPromise,watchdog]);
        processGPSPosition(position);
        startGPSWatch();
        $("gpsButton").textContent="GPS ✓";
        statusBox.textContent="GPS aktiv";
    }catch(e){
        if(e && e.message==="IOS_STANDALONE_TIMEOUT"){
            gpsState="STANDALONE_TIMEOUT";
            gpsError="Kein Standortdialog / keine Antwort";
            $("gpsButton").textContent="GPS ERNEUT";
            statusBox.textContent="GPS: iOS blockiert";
        }else{
            processGPSError(e);
            $("gpsButton").textContent=(e&&e.code===1)?"GPS GESPERRT":"GPS ERNEUT";
            statusBox.textContent="GPS Fehler";
        }
    }
});
$("zeroButton").addEventListener("click",setZero);
$("swapButton").addEventListener("click",swapAxes);
$("debugButton").addEventListener("click",()=>{debugVisible=!debugVisible;debugBox.style.display=debugVisible?"block":"none";updateDebug()});
updateSwapButton();
probeGPSPermission();
</script>
</body>
</html>
