<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000">

<title>PFD V7</title>

<style>
*{
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

#pfd{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

/* =====================================================
   ATTITUDE
===================================================== */

#viewport{
    position:absolute;
    inset:0;
    overflow:hidden;
}

#horizon{
    position:absolute;
    width:320vw;
    height:320vh;
    left:50%;
    top:50%;
    margin-left:-160vw;
    margin-top:-160vh;
    transform-origin:center center;

    background:
    linear-gradient(
        to bottom,
        #1689bc 0%,
        #1689bc 49.88%,
        #fff 49.88%,
        #fff 50.12%,
        #84502f 50.12%,
        #84502f 100%
    );
}

/* =====================================================
   PITCH LADDER
===================================================== */

#pitchLadder{
    position:absolute;
    left:50%;
    top:50%;
    width:620px;
    height:1200px;
    transform:translate(-50%,-50%);
}

.pitchLine{
    position:absolute;
    left:50%;
    height:3px;
    background:#fff;
    transform:translateX(-50%);
    box-shadow:0 1px 2px #000;
}

.pitchLine.five{
    width:64px;
}

.pitchLine.ten{
    width:145px;
}

.pitchLine.thirty{
    width:175px;
}

.pitchLabel{
    position:absolute;
    width:38px;
    text-align:center;
    font-size:16px;
    line-height:20px;
    font-weight:700;
    color:#fff;
    text-shadow:
        -1px -1px 1px #000,
         1px  1px 1px #000;
}

/* =====================================================
   AIRCRAFT SYMBOL
===================================================== */

#aircraft{
    position:absolute;
    left:50%;
    top:50%;
    width:300px;
    height:70px;
    transform:translate(-50%,-50%);
    z-index:40;
}

.aircraftWing{
    position:absolute;
    top:32px;
    height:6px;
    width:112px;
    background:#ffd800;
    border:1px solid #222;
    box-shadow:0 0 2px #000;
}

.aircraftWing.left{
    left:0;
}

.aircraftWing.right{
    right:0;
}

.aircraftWing.left::after,
.aircraftWing.right::after{
    content:"";
    position:absolute;
    width:6px;
    height:23px;
    top:-17px;
    background:#ffd800;
    border:1px solid #222;
}

.aircraftWing.left::after{
    right:0;
}

.aircraftWing.right::after{
    left:0;
}

#aircraftCenter{
    position:absolute;
    left:50%;
    top:24px;
    width:22px;
    height:22px;
    transform:translateX(-50%);
    border:4px solid #ffd800;
    border-radius:50%;
    box-shadow:0 0 2px #000;
}

/* =====================================================
   ROLL SCALE
===================================================== */

#rollScale{
    position:absolute;
    left:50%;
    top:88px;
    width:360px;
    height:125px;
    transform:translateX(-50%);
    z-index:45;
    pointer-events:none;
}

#rollTicks{
    position:absolute;
    inset:0;
}

.rollTick{
    position:absolute;
    left:50%;
    top:0;
    width:2px;
    height:13px;
    background:#fff;
    transform-origin:1px 105px;
    box-shadow:0 0 2px #000;
}

.rollTick.major{
    height:21px;
    width:3px;
}

.rollTick.medium{
    height:17px;
}

.rollNumber{
    position:absolute;
    left:50%;
    top:0;
    width:34px;
    margin-left:-17px;
    text-align:center;
    font-size:13px;
    font-weight:700;
    transform-origin:17px 105px;
    text-shadow:0 1px 2px #000;
}

/*
   Feststehendes Dreieck oben.
*/

#fixedRollPointer{
    position:absolute;
    left:50%;
    top:96px;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:15px solid #ffd800;
    z-index:48;
}

/*
   Beweglicher Bank-Pointer.
*/

#bankPointerWrapper{
    position:absolute;
    left:50%;
    top:88px;
    width:360px;
    height:125px;
    transform:translateX(-50%);
    transform-origin:50% 105px;
    z-index:47;
    pointer-events:none;
}

#bankPointer{
    position:absolute;
    left:50%;
    top:20px;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-bottom:13px solid #fff;
    filter:drop-shadow(0 1px 1px #000);
}

/* =====================================================
   HEADING TAPE
===================================================== */

#headingBox{
    position:absolute;
    left:50%;
    top:calc(env(safe-area-inset-top) + 4px);
    width:70%;
    height:64px;
    transform:translateX(-50%);
    overflow:hidden;
    background:rgba(0,0,0,.58);
    border-left:1px solid rgba(255,255,255,.35);
    border-right:1px solid rgba(255,255,255,.35);
    border-bottom:1px solid rgba(255,255,255,.55);
    z-index:70;
}

#headingTape{
    position:absolute;
    top:0;
    height:100%;
}

.headingMark{
    position:absolute;
    top:35px;
    width:1px;
    height:10px;
    background:#fff;
}

.headingMark.major{
    width:2px;
    height:18px;
}

.headingLabel{
    position:absolute;
    top:6px;
    transform:translateX(-50%);
    font-size:15px;
    font-weight:700;
    white-space:nowrap;
}

#headingPointer{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-bottom:11px solid #ffd800;
}

#headingValue{
    position:absolute;
    left:50%;
    top:calc(env(safe-area-inset-top) + 70px);
    transform:translateX(-50%);
    min-width:65px;
    padding:3px 8px;
    text-align:center;
    background:#050505;
    border:2px solid #00ff63;
    color:#00ff63;
    font-family:Menlo,monospace;
    font-size:20px;
    font-weight:700;
    z-index:72;
}

/* =====================================================
   BOTTOM DATA
===================================================== */

.dataBox{
    position:absolute;
    bottom:calc(10px + env(safe-area-inset-bottom));
    padding:6px 9px;
    background:rgba(0,0,0,.72);
    border:1px solid rgba(255,255,255,.45);
    font-family:Menlo,monospace;
    font-size:12px;
    z-index:80;
}

.dataValue{
    color:#00ff63;
    font-weight:700;
}

#pitchBox{
    left:10px;
}

#rollBox{
    left:125px;
}

#headingData{
    right:10px;
}

/* =====================================================
   CONTROLS
===================================================== */

#controls{
    position:absolute;
    right:10px;
    top:calc(88px + env(safe-area-inset-top));
    display:flex;
    flex-direction:column;
    gap:6px;
    z-index:100;
}

button{
    appearance:none;
    border:1px solid #aaa;
    border-radius:6px;
    background:rgba(0,0,0,.76);
    color:#fff;
    padding:8px 10px;
    font-size:12px;
    font-weight:650;
}

#startButton{
    border-color:#00ff63;
    color:#00ff63;
}

#status{
    position:absolute;
    left:50%;
    bottom:calc(47px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    padding:4px 8px;
    background:rgba(0,0,0,.65);
    border-radius:4px;
    font-size:10px;
    z-index:100;
}

#debug{
    position:absolute;
    left:8px;
    top:95px;
    padding:7px;
    background:rgba(0,0,0,.82);
    color:#00ff63;
    font:10px Menlo,monospace;
    z-index:110;
    display:none;
}

</style>
</head>

<body>

<div id="pfd">

    <div id="viewport">
        <div id="horizon">
            <div id="pitchLadder"></div>
        </div>
    </div>

    <!-- Roll scale -->
    <div id="rollScale">
        <div id="rollTicks"></div>
    </div>

    <div id="fixedRollPointer"></div>

    <div id="bankPointerWrapper">
        <div id="bankPointer"></div>
    </div>

    <!-- Fixed aircraft -->
    <div id="aircraft">
        <div class="aircraftWing left"></div>
        <div id="aircraftCenter"></div>
        <div class="aircraftWing right"></div>
    </div>

    <!-- Heading -->
    <div id="headingBox">
        <div id="headingTape"></div>
        <div id="headingPointer"></div>
    </div>

    <div id="headingValue">---</div>

    <!-- Controls -->
    <div id="controls">

        <button id="startButton">
            SENSOREN STARTEN
        </button>

        <button id="zeroButton">
            ZERO
        </button>

        <button id="debugButton">
            DEBUG
        </button>

    </div>

    <!-- Data -->
    <div id="pitchBox" class="dataBox">
        PITCH
        <span id="pitchValue" class="dataValue">0.0°</span>
    </div>

    <div id="rollBox" class="dataBox">
        ROLL
        <span id="rollValue" class="dataValue">0.0°</span>
    </div>

    <div id="headingData" class="dataBox">
        HDG
        <span id="headingDataValue" class="dataValue">---</span>
    </div>

    <div id="status">
        PFD V7
    </div>

    <div id="debug"></div>

</div>


<script>

/* ==========================================================
   SENSOR CONFIG
   V6.1 BASIS
========================================================== */

const RAD_TO_DEG = 180 / Math.PI;

const PX_PER_DEG = 7;

const GRAVITY_FILTER = 0.08;

const DISPLAY_FILTER = 0.14;

const HEADING_FILTER = 0.10;

const DEADBAND = 0.20;

const MAX_PITCH = 60;

const MAX_ROLL = 60;


/* ==========================================================
   ELEMENTS
========================================================== */

const horizon =
    document.getElementById("horizon");

const ladder =
    document.getElementById("pitchLadder");

const pitchValue =
    document.getElementById("pitchValue");

const rollValue =
    document.getElementById("rollValue");

const headingValue =
    document.getElementById("headingValue");

const headingDataValue =
    document.getElementById("headingDataValue");

const headingBox =
    document.getElementById("headingBox");

const headingTape =
    document.getElementById("headingTape");

const bankPointerWrapper =
    document.getElementById("bankPointerWrapper");

const statusBox =
    document.getElementById("status");

const debugBox =
    document.getElementById("debug");


/* ==========================================================
   STATE
========================================================== */

let gravity = null;

let rawPitch = 0;
let rawRoll = 0;

let zeroPitch = 0;
let zeroRoll = 0;

let targetPitch = 0;
let targetRoll = 0;

let displayPitch = 0;
let displayRoll = 0;

let rawHeading = 0;
let displayHeading = 0;

let haveHeading = false;
let haveMotion = false;

let debugVisible = false;


/* ==========================================================
   HELPERS
========================================================== */

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );
}


function smooth(current,target,factor){

    return (
        current +
        (target-current) *
        factor
    );
}


function smoothAngle(current,target,factor){

    const delta =
        ((target-current+540)%360)-180;

    return (
        current +
        delta*factor +
        360
    )%360;
}


function normalize180(angle){

    while(angle>180){
        angle-=360;
    }

    while(angle<-180){
        angle+=360;
    }

    return angle;
}


/* ==========================================================
   GRAVITY FILTER
========================================================== */

function filterGravity(x,y,z){

    if(!gravity){

        gravity={
            x:x,
            y:y,
            z:z
        };

        return;
    }

    gravity.x +=
        (x-gravity.x) *
        GRAVITY_FILTER;

    gravity.y +=
        (y-gravity.y) *
        GRAVITY_FILTER;

    gravity.z +=
        (z-gravity.z) *
        GRAVITY_FILTER;
}


/* ==========================================================
   ATTITUDE

   IDENTISCHES V6.1-PRINZIP

   PITCH = X
   ROLL  = Z

   -Y bleibt stabiler Nenner.
========================================================== */

function calculateAttitude(){

    if(!gravity){
        return;
    }

    const x = gravity.x;
    const y = gravity.y;
    const z = gravity.z;

    const magnitude =
        Math.sqrt(
            x*x +
            y*y +
            z*z
        );

    if(magnitude < 3){
        return;
    }


    /* PITCH */

    rawPitch =
        Math.atan2(
            x,
            -y
        ) *
        RAD_TO_DEG;


    /* ROLL */

    rawRoll =
        Math.atan2(
            z,
            -y
        ) *
        RAD_TO_DEG;


    let pitch =
        normalize180(
            rawPitch -
            zeroPitch
        );

    let roll =
        normalize180(
            rawRoll -
            zeroRoll
        );


    if(Math.abs(pitch)<DEADBAND){
        pitch=0;
    }

    if(Math.abs(roll)<DEADBAND){
        roll=0;
    }


    targetPitch =
        clamp(
            pitch,
            -MAX_PITCH,
            MAX_PITCH
        );

    targetRoll =
        clamp(
            roll,
            -MAX_ROLL,
            MAX_ROLL
        );


    if(debugVisible){

        debugBox.innerHTML =

            "PFD V7 / V6.1 SENSOR<br><br>" +

            "GX: " +
            x.toFixed(3) +
            "<br>" +

            "GY: " +
            y.toFixed(3) +
            "<br>" +

            "GZ: " +
            z.toFixed(3) +
            "<br><br>" +

            "|G|: " +
            magnitude.toFixed(2) +
            "<br><br>" +

            "RAW P: " +
            rawPitch.toFixed(2) +
            "°<br>" +

            "RAW R: " +
            rawRoll.toFixed(2) +
            "°<br><br>" +

            "PITCH: " +
            pitch.toFixed(2) +
            "°<br>" +

            "ROLL: " +
            roll.toFixed(2) +
            "°";
    }
}


/* ==========================================================
   DEVICE MOTION
========================================================== */

function handleMotion(event){

    const g =
        event.accelerationIncludingGravity;

    if(!g){
        return;
    }

    if(
        g.x == null ||
        g.y == null ||
        g.z == null
    ){
        return;
    }

    filterGravity(
        g.x,
        g.y,
        g.z
    );

    haveMotion = true;

    calculateAttitude();
}


/* ==========================================================
   COMPASS
========================================================== */

function handleOrientation(event){

    if(
        typeof event.webkitCompassHeading
            === "number" &&
        !Number.isNaN(
            event.webkitCompassHeading
        )
    ){

        rawHeading =
            event.webkitCompassHeading;

        haveHeading = true;

        return;
    }


    if(
        typeof event.alpha === "number"
    ){

        rawHeading =
            (360-event.alpha)%360;

        haveHeading = true;
    }
}


/* ==========================================================
   ZERO
========================================================== */

function setZero(){

    if(
        !haveMotion ||
        !gravity
    ){

        statusBox.textContent =
            "Noch keine Sensordaten";

        return;
    }

    const x = gravity.x;
    const y = gravity.y;
    const z = gravity.z;


    zeroPitch =
        Math.atan2(
            x,
            -y
        ) *
        RAD_TO_DEG;


    zeroRoll =
        Math.atan2(
            z,
            -y
        ) *
        RAD_TO_DEG;


    rawPitch = zeroPitch;
    rawRoll = zeroRoll;

    targetPitch = 0;
    targetRoll = 0;

    displayPitch = 0;
    displayRoll = 0;

    statusBox.textContent =
        "ZERO gesetzt";
}


/* ==========================================================
   SENSOR START
========================================================== */

async function startSensors(){

    try{

        statusBox.textContent =
            "Sensorfreigabe…";


        if(
            typeof DeviceMotionEvent !==
                "undefined" &&
            typeof DeviceMotionEvent
                .requestPermission ===
                "function"
        ){

            const permission =
                await DeviceMotionEvent
                    .requestPermission();

            if(permission !== "granted"){

                statusBox.textContent =
                    "Motion verweigert";

                return;
            }
        }


        if(
            typeof DeviceOrientationEvent !==
                "undefined" &&
            typeof DeviceOrientationEvent
                .requestPermission ===
                "function"
        ){

            let permission;

            try{

                permission =
                    await DeviceOrientationEvent
                        .requestPermission(true);

            }catch{

                permission =
                    await DeviceOrientationEvent
                        .requestPermission();
            }

            if(permission !== "granted"){

                statusBox.textContent =
                    "Kompass verweigert";

                return;
            }
        }


        window.addEventListener(
            "devicemotion",
            handleMotion,
            true
        );

        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );


        document
            .getElementById("startButton")
            .style.display =
            "none";


        statusBox.textContent =
            "Sensoren aktiv";


        setTimeout(
            function(){

                if(haveMotion){

                    setZero();

                    statusBox.textContent =
                        "PFD aktiv · AUTO ZERO";
                }

            },
            1500
        );

    }catch(error){

        console.error(error);

        statusBox.textContent =
            "Fehler: " +
            error.message;
    }
}


/* ==========================================================
   PITCH LADDER

   5° Schritte.
   10° stärker.
========================================================== */

for(
    let deg=-40;
    deg<=40;
    deg+=5
){

    if(deg===0){
        continue;
    }


    const line =
        document.createElement("div");


    if(Math.abs(deg)>=30 && deg%10===0){

        line.className =
            "pitchLine thirty";

    }else if(deg%10===0){

        line.className =
            "pitchLine ten";

    }else{

        line.className =
            "pitchLine five";
    }


    const y =
        600 -
        deg *
        PX_PER_DEG;


    line.style.top =
        y+"px";


    ladder.appendChild(line);


    if(deg%10===0){

        const left =
            document.createElement("div");

        const right =
            document.createElement("div");


        left.className =
            "pitchLabel";

        right.className =
            "pitchLabel";


        left.textContent =
            Math.abs(deg);

        right.textContent =
            Math.abs(deg);


        left.style.top =
            (y-9)+"px";

        right.style.top =
            (y-9)+"px";


        left.style.left =
            "188px";

        right.style.right =
            "188px";


        ladder.appendChild(left);
        ladder.appendChild(right);
    }
}


/* ==========================================================
   ROLL SCALE

   ±10 / 20 / 30 / 45 / 60
========================================================== */

const rollTicks =
    document.getElementById("rollTicks");


const rollMarks = [
    -60,-45,-30,-20,-10,
    0,
    10,20,30,45,60
];


for(const angle of rollMarks){

    const tick =
        document.createElement("div");


    tick.className =
        "rollTick";


    if(
        angle===0 ||
        Math.abs(angle)===30 ||
        Math.abs(angle)===60
    ){

        tick.classList.add("major");

    }else if(
        Math.abs(angle)===45
    ){

        tick.classList.add("medium");
    }


    tick.style.transform =
        "rotate(" +
        angle +
        "deg)";


    rollTicks.appendChild(tick);


    if(
        angle!==0 &&
        (
            Math.abs(angle)===10 ||
            Math.abs(angle)===20 ||
            Math.abs(angle)===30 ||
            Math.abs(angle)===45 ||
            Math.abs(angle)===60
        )
    ){

        const number =
            document.createElement("div");


        number.className =
            "rollNumber";


        number.textContent =
            Math.abs(angle);


        number.style.transform =
            "rotate(" +
            angle +
            "deg)";


        rollTicks.appendChild(number);
    }
}


/* ==========================================================
   HEADING TAPE
========================================================== */

const HEADING_PX_PER_DEG = 5;


for(
    let deg=-360;
    deg<=720;
    deg+=5
){

    const normalized =
        ((deg%360)+360)%360;


    const mark =
        document.createElement("div");


    mark.className =
        "headingMark " +
        (
            normalized%10===0
            ? "major"
            : ""
        );


    mark.style.left =
        (
            deg *
            HEADING_PX_PER_DEG
        ) +
        "px";


    headingTape.appendChild(mark);


    if(normalized%30===0){

        const label =
            document.createElement("div");


        label.className =
            "headingLabel";


        if(normalized===0){

            label.textContent="N";

        }else if(normalized===90){

            label.textContent="E";

        }else if(normalized===180){

            label.textContent="S";

        }else if(normalized===270){

            label.textContent="W";

        }else{

            label.textContent =
                String(normalized/10)
                    .padStart(2,"0");
        }


        label.style.left =
            (
                deg *
                HEADING_PX_PER_DEG
            ) +
            "px";


        headingTape.appendChild(label);
    }
}


/* ==========================================================
   RENDER
========================================================== */

function render(){

    /*
       IDENTISCHE V6.1-Glättung
    */

    displayPitch =
        smooth(
            displayPitch,
            targetPitch,
            DISPLAY_FILTER
        );


    displayRoll =
        smooth(
            displayRoll,
            targetRoll,
            DISPLAY_FILTER
        );


    /*
       Artificial horizon
    */

    horizon.style.transform =

        "translateY(" +

        (
            displayPitch *
            PX_PER_DEG
        ) +

        "px) rotate(" +

        (
            -displayRoll
        ) +

        "deg)";


    /*
       Beweglicher Bank-Pointer
    */

    bankPointerWrapper.style.transform =

        "translateX(-50%) rotate(" +

        (
            -displayRoll
        ) +

        "deg)";


    /*
       Digitalwerte
    */

    pitchValue.textContent =
        displayPitch
            .toFixed(1) +
        "°";


    rollValue.textContent =
        displayRoll
            .toFixed(1) +
        "°";


    /*
       Heading
    */

    if(haveHeading){

        displayHeading =
            smoothAngle(
                displayHeading,
                rawHeading,
                HEADING_FILTER
            );


        let heading =
            Math.round(
                displayHeading
            )%360;


        if(heading===0){
            heading=360;
        }


        const text =
            String(heading)
                .padStart(3,"0");


        headingValue.textContent =
            text;


        headingDataValue.textContent =
            text+"°";


        const center =
            headingBox.clientWidth/2;


        headingTape.style.transform =

            "translateX(" +

            (
                center -
                displayHeading *
                HEADING_PX_PER_DEG
            ) +

            "px)";
    }


    requestAnimationFrame(render);
}


render();

========================================================== */

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        startSensors
    );


document
    .getElementById("zeroButton")
    .addEventListener(
        "click",
        setZero
    );


document
    .getElementById("debugButton")
    .addEventListener(
        "click",
        function(){

            debugVisible =
                !debugVisible;

            debugBox.style.display =
                debugVisible
                ? "block"
                : "none";
        }
    );

</script>
