<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">

<title>PFD V6.5</title>

<style>

*{
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;
}

#pfd{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

/* =========================================================
   ATTITUDE FIELD
========================================================= */

#viewport{
    position:absolute;
    inset:0;
    overflow:hidden;
}

#horizon{
    position:absolute;

    width:340vw;
    height:340vh;

    left:50%;
    top:50%;

    margin-left:-170vw;
    margin-top:-170vh;

    transform-origin:center center;

    background:
        linear-gradient(
            to bottom,

            #002e58 0%,
            #004f8c 35%,
            #0876b7 48.9%,

            #ffffff 49.75%,
            #ffffff 50.25%,

            #794010 50.25%,
            #572b0b 65%,
            #281202 100%
        );
}

/* subtle lighting */

#horizon::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.07) 0%,
            rgba(0,0,0,0) 42%,
            rgba(0,0,0,.22) 100%
        );

    pointer-events:none;
}

/* =========================================================
   PITCH LADDER
========================================================= */

#pitchLadder{
    position:absolute;

    left:50%;
    top:50%;

    width:520px;
    height:1100px;

    transform:translate(-50%,-50%);
}

.pitchLine{
    position:absolute;

    left:50%;

    height:1.5px;

    background:#fff;

    transform:translateX(-50%);

    box-shadow:
        0 1px 2px rgba(0,0,0,.95);
}

/* 5 / 15 / 25 / 35 */

.pitchLine.five{
    width:52px;
}

/* 10 / 20 / 30 / 40 */

.pitchLine.ten{
    width:118px;
}

.pitchLabel{
    position:absolute;

    width:36px;

    color:#fff;

    text-align:center;

    font-size:15px;
    font-weight:600;

    line-height:20px;

    text-shadow:
        0 1px 3px #000,
        0 0 2px #000;
}

/* =========================================================
   AIRCRAFT REFERENCE
========================================================= */

#aircraft{
    position:absolute;

    left:50%;
    top:50%;

    width:270px;
    height:44px;

    transform:translate(-50%,-50%);

    z-index:70;
}

.wing{
    position:absolute;

    top:20px;

    width:105px;
    height:4px;

    background:#ffd900;

    border:1px solid #111;

    box-shadow:
        0 1px 2px rgba(0,0,0,.9);
}

.wing.left{
    left:0;
}

.wing.right{
    right:0;
}

.wing.left::after,
.wing.right::after{
    content:"";

    position:absolute;

    top:-13px;

    width:5px;
    height:18px;

    background:#ffd900;

    border:1px solid #111;
}

.wing.left::after{
    right:-1px;
}

.wing.right::after{
    left:-1px;
}

#centerCircle{
    position:absolute;

    left:50%;
    top:11px;

    transform:translateX(-50%);

    width:22px;
    height:22px;

    border:4px solid #ffd900;

    border-radius:50%;

    background:transparent;

    box-shadow:
        0 1px 2px #000;
}

/* =========================================================
   HEADING TAPE
========================================================= */

#headingBox{
    position:absolute;

    left:6%;
    right:6%;

    top:calc(8px + env(safe-area-inset-top));

    height:76px;

    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            rgba(0,13,25,.97),
            rgba(0,28,47,.92)
        );

    border-bottom:
        1px solid rgba(255,255,255,.48);

    z-index:100;
}

#headingTape{
    position:absolute;
    top:0;
    height:100%;
}

.headingMark{
    position:absolute;

    bottom:0;

    width:1px;
    height:7px;

    background:#fff;
}

.headingMark.ten{
    width:1.5px;
    height:14px;
}

.headingLabel{
    position:absolute;

    top:32px;

    transform:translateX(-50%);

    color:#fff;

    font-size:12px;
    font-weight:500;

    white-space:nowrap;

    text-shadow:0 1px 2px #000;
}

.headingLabel.cardinal{
    top:5px;

    color:#fff;

    font-size:18px;
    font-weight:700;
}

.headingLabel.cardinal.currentNorth{
    color:#ffd900;
}

/* fixed heading index */

#headingIndex{
    position:absolute;

    left:50%;
    bottom:0;

    width:2px;
    height:26px;

    transform:translateX(-50%);

    background:#ffd900;

    z-index:103;
}

#headingPointer{
    position:absolute;

    left:50%;

    top:calc(84px + env(safe-area-inset-top));

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:12px solid transparent;
    border-right:12px solid transparent;
    border-bottom:16px solid #ffd900;

    z-index:105;
}

/* =========================================================
   ROLL SCALE
========================================================= */

#rollScale{
    position:absolute;

    left:50%;

    top:calc(96px + env(safe-area-inset-top));

    width:390px;
    height:120px;

    transform:translateX(-50%);

    pointer-events:none;

    z-index:85;
}

#rollArc{
    position:absolute;

    left:50%;
    top:45px;

    width:305px;
    height:92px;

    transform:translateX(-50%);

    border-top:
        2px solid rgba(255,255,255,.92);

    border-radius:50% 50% 0 0 / 100% 100% 0 0;

    opacity:.95;
}

.rollTick{
    position:absolute;

    left:50%;
    top:28px;

    width:1.5px;
    height:9px;

    background:#fff;

    transform-origin:1px 82px;

    box-shadow:0 1px 2px #000;
}

.rollTick.medium{
    height:14px;
}

.rollTick.major{
    width:2px;
    height:18px;
}

.rollNumber{
    position:absolute;

    left:50%;
    top:3px;

    width:30px;

    margin-left:-15px;

    text-align:center;

    color:#fff;

    font-size:12px;
    font-weight:600;

    transform-origin:15px 107px;

    text-shadow:
        0 1px 3px #000;
}

/* fixed bank pointer */

#fixedBankPointer{
    position:absolute;

    left:50%;

    top:calc(107px + env(safe-area-inset-top));

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-bottom:13px solid #ffd900;

    z-index:91;
}

/* moving bank pointer */

#movingBank{
    position:absolute;

    left:50%;

    top:calc(96px + env(safe-area-inset-top));

    width:390px;
    height:120px;

    transform:
        translateX(-50%)
        rotate(0deg);

    transform-origin:50% 110px;

    pointer-events:none;

    z-index:90;
}

#movingBankPointer{
    position:absolute;

    left:50%;
    top:37px;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-top:12px solid #fff;

    filter:
        drop-shadow(0 1px 2px #000);
}

/* =========================================================
   CONTROL PANEL — RIGHT BOTTOM
========================================================= */

#controls{
    position:absolute;

    right:
        calc(8px + env(safe-area-inset-right));

    bottom:
        calc(62px + env(safe-area-inset-bottom));

    display:flex;

    flex-direction:column;

    align-items:stretch;

    gap:4px;

    z-index:150;

    opacity:.62;
}

button{
    appearance:none;
    -webkit-appearance:none;

    width:62px;
    min-height:31px;

    margin:0;

    padding:4px 3px;

    border:
        1px solid rgba(255,255,255,.45);

    border-radius:6px;

    background:
        rgba(0,18,30,.54);

    color:
        rgba(255,255,255,.95);

    font-family:inherit;

    font-size:9px;
    font-weight:600;

    letter-spacing:.2px;

    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);

    box-shadow:
        0 1px 3px rgba(0,0,0,.35);
}

button:active{
    background:
        rgba(255,255,255,.20);
}

#startButton{
    color:#30e55b;

    border-color:
        rgba(48,229,91,.60);
}

#swapButton{
    color:#ffe000;

    border-color:
        rgba(255,224,0,.65);
}

/* =========================================================
   DATA BOXES
========================================================= */

.dataBox{
    position:absolute;

    bottom:
        calc(9px + env(safe-area-inset-bottom));

    min-width:94px;

    padding:5px 7px;

    background:
        rgba(0,0,0,.67);

    border:
        1px solid rgba(255,255,255,.42);

    border-radius:3px;

    color:#fff;

    font-family:
        Menlo,
        "SF Mono",
        monospace;

    font-size:10px;

    z-index:130;
}

.dataBox span{
    color:#24e95a;
    font-size:12px;
}

#pitchBox{
    left:
        calc(9px + env(safe-area-inset-left));
}

#rollBox{
    left:
        calc(116px + env(safe-area-inset-left));
}

#headingData{
    right:
        calc(9px + env(safe-area-inset-right));
}

/* =========================================================
   STATUS
========================================================= */

#status{
    position:absolute;

    left:50%;

    bottom:
        calc(10px + env(safe-area-inset-bottom));

    transform:translateX(-50%);

    padding:5px 10px;

    min-width:108px;

    text-align:center;

    background:
        rgba(0,0,0,.55);

    border:
        1px solid rgba(255,255,255,.22);

    border-radius:5px;

    color:#24e95a;

    font-size:9px;

    z-index:125;
}

/* =========================================================
   DEBUG
========================================================= */

#debug{
    position:absolute;

    left:7px;

    top:
        calc(105px + env(safe-area-inset-top));

    padding:7px;

    background:
        rgba(0,0,0,.78);

    border:
        1px solid rgba(0,255,100,.35);

    color:#00ff65;

    font-family:Menlo,monospace;

    font-size:9px;

    line-height:1.4;

    z-index:180;

    display:none;
}

/* =========================================================
   SMALL DISPLAYS
========================================================= */

@media(max-width:430px){

    #headingBox{
        left:4%;
        right:4%;
    }

    #rollScale,
    #movingBank{
        width:360px;
    }

    #aircraft{
        width:255px;
    }

    .wing{
        width:98px;
    }
}

</style>
</head>

<body>

<div id="pfd">

    <div id="viewport">

        <div id="horizon">

            <div id="pitchLadder"></div>

        </div>

    </div>


    <!-- HEADING -->

    <div id="headingBox">

        <div id="headingTape"></div>

        <div id="headingIndex"></div>

    </div>

    <div id="headingPointer"></div>


    <!-- ROLL -->

    <div id="rollScale">

        <div id="rollArc"></div>

    </div>

    <div id="movingBank">

        <div id="movingBankPointer"></div>

    </div>

    <div id="fixedBankPointer"></div>


    <!-- AIRCRAFT -->

    <div id="aircraft">

        <div class="wing left"></div>

        <div id="centerCircle"></div>

        <div class="wing right"></div>

    </div>


    <!-- CONTROLS -->

    <div id="controls">

        <button id="startButton">
            ▶ START
        </button>

        <button id="zeroButton">
            ZERO
        </button>

        <button id="swapButton">
            P↔R Z/X
        </button>

        <button id="debugButton">
            DEBUG
        </button>

    </div>


    <!-- DATA -->

    <div id="pitchBox" class="dataBox">

        PITCH&nbsp;
        <span id="pitchValue">
            0.0°
        </span>

    </div>


    <div id="rollBox" class="dataBox">

        ROLL&nbsp;
        <span id="rollValue">
            0.0°
        </span>

    </div>


    <div id="headingData" class="dataBox">

        HDG&nbsp;
        <span id="headingDataValue">
            ---
        </span>

    </div>


    <div id="status">
        V6.5
    </div>

    <div id="debug"></div>

</div>


<script>

/* ==========================================================
   V6.5

   WICHTIG:
   Sensor-/Filterberechnung bleibt gegenüber V6.4 unverändert.
   Änderungen betreffen primär die Darstellung.
========================================================== */

const RAD_TO_DEG = 180 / Math.PI;

const PX_PER_DEG = 7;

const GRAVITY_FILTER = 0.08;

const DISPLAY_FILTER = 0.14;

const HEADING_FILTER = 0.10;

const DEADBAND = 0.20;

const MAX_PITCH = 60;

const MAX_ROLL = 60;


/* ==========================================================
   ELEMENTS
========================================================== */

const horizon =
    document.getElementById("horizon");

const ladder =
    document.getElementById("pitchLadder");

const pitchValue =
    document.getElementById("pitchValue");

const rollValue =
    document.getElementById("rollValue");

const headingDataValue =
    document.getElementById("headingDataValue");

const headingBox =
    document.getElementById("headingBox");

const headingTape =
    document.getElementById("headingTape");

const statusBox =
    document.getElementById("status");

const debugBox =
    document.getElementById("debug");

const swapButton =
    document.getElementById("swapButton");

const movingBank =
    document.getElementById("movingBank");


/* ==========================================================
   SENSOR STATE
========================================================== */

let gravity = null;

let rawPitch = 0;
let rawRoll = 0;

let zeroPitch = 0;
let zeroRoll = 0;

let targetPitch = 0;
let targetRoll = 0;

let displayPitch = 0;
let displayRoll = 0;

let rawHeading = 0;
let displayHeading = 0;

let haveHeading = false;
let haveMotion = false;

let debugVisible = false;

let swapPitchRoll = true;


/* ==========================================================
   HELPERS
========================================================== */

function clamp(value,minimum,maximum){

    return Math.max(
        minimum,
        Math.min(
            maximum,
            value
        )
    );
}


function smooth(current,target,factor){

    return current +
        (target-current) *
        factor;
}


function smoothAngle(current,target,factor){

    const delta =
        ((target-current+540)%360)-180;

    return (
        current +
        delta*factor +
        360
    ) % 360;
}


function normalize180(angle){

    while(angle>180){
        angle-=360;
    }

    while(angle<-180){
        angle+=360;
    }

    return angle;
}


/* ==========================================================
   GRAVITY FILTER
========================================================== */

function filterGravity(x,y,z){

    if(!gravity){

        gravity={
            x:x,
            y:y,
            z:z
        };

        return;
    }

    gravity.x +=
        (x-gravity.x) *
        GRAVITY_FILTER;

    gravity.y +=
        (y-gravity.y) *
        GRAVITY_FILTER;

    gravity.z +=
        (z-gravity.z) *
        GRAVITY_FILTER;
}


/* ==========================================================
   ATTITUDE AXES
========================================================== */

function getAttitudeAngles(){

    if(!gravity){
        return null;
    }

    const x=gravity.x;
    const y=gravity.y;
    const z=gravity.z;

    const angleX =
        Math.atan2(
            x,
            -y
        ) * RAD_TO_DEG;

    const angleZ =
        Math.atan2(
            z,
            -y
        ) * RAD_TO_DEG;


    if(swapPitchRoll){

        return{
            pitch:angleZ,
            roll:angleX
        };
    }

    return{
        pitch:angleX,
        roll:angleZ
    };
}


/* ==========================================================
   ATTITUDE CALCULATION
========================================================== */

function calculateAttitude(){

    if(!gravity){
        return;
    }

    const x=gravity.x;
    const y=gravity.y;
    const z=gravity.z;

    const magnitude=
        Math.sqrt(
            x*x +
            y*y +
            z*z
        );

    if(magnitude<3){
        return;
    }


    const angles=
        getAttitudeAngles();


    if(!angles){
        return;
    }


    rawPitch=
        angles.pitch;

    rawRoll=
        angles.roll;


    let pitch=
        normalize180(
            rawPitch-zeroPitch
        );


    let roll=
        normalize180(
            rawRoll-zeroRoll
        );


    if(
        Math.abs(pitch) <
        DEADBAND
    ){
        pitch=0;
    }


    if(
        Math.abs(roll) <
        DEADBAND
    ){
        roll=0;
    }


    targetPitch=
        clamp(
            pitch,
            -MAX_PITCH,
            MAX_PITCH
        );


    targetRoll=
        clamp(
            roll,
            -MAX_ROLL,
            MAX_ROLL
        );


    if(debugVisible){

        debugBox.innerHTML=

        "PFD V6.5<br>"+
        "SENSOR CORE V6.4<br><br>"+

        "MODE: "+
        (
            swapPitchRoll
            ?"P=Z / R=X"
            :"P=X / R=Z"
        )+
        "<br><br>"+

        "GX: "+
        x.toFixed(3)+
        "<br>"+

        "GY: "+
        y.toFixed(3)+
        "<br>"+

        "GZ: "+
        z.toFixed(3)+
        "<br><br>"+

        "|G|: "+
        magnitude.toFixed(2)+
        "<br><br>"+

        "RAW P: "+
        rawPitch.toFixed(2)+
        "°<br>"+

        "RAW R: "+
        rawRoll.toFixed(2)+
        "°<br><br>"+

        "REL P: "+
        pitch.toFixed(2)+
        "°<br>"+

        "REL R: "+
        roll.toFixed(2)+
        "°";
    }
}


/* ==========================================================
   MOTION
========================================================== */

function handleMotion(event){

    const g=
        event.accelerationIncludingGravity;

    if(!g){
        return;
    }

    if(
        g.x==null ||
        g.y==null ||
        g.z==null
    ){
        return;
    }


    filterGravity(
        g.x,
        g.y,
        g.z
    );


    haveMotion=true;

    calculateAttitude();
}


/* ==========================================================
   COMPASS
========================================================== */

function handleOrientation(event){

    if(
        typeof event.webkitCompassHeading
        === "number" &&

        !Number.isNaN(
            event.webkitCompassHeading
        )
    ){

        rawHeading=
            event.webkitCompassHeading;

        haveHeading=true;

        return;
    }


    if(
        typeof event.alpha
        === "number"
    ){

        rawHeading=
            (360-event.alpha)%360;

        haveHeading=true;
    }
}


/* ==========================================================
   ZERO
========================================================== */

function setZero(){

    if(
        !haveMotion ||
        !gravity
    ){

        statusBox.textContent=
            "Keine Sensordaten";

        return;
    }


    const angles=
        getAttitudeAngles();


    if(!angles){
        return;
    }


    zeroPitch=
        angles.pitch;

    zeroRoll=
        angles.roll;


    rawPitch=
        zeroPitch;

    rawRoll=
        zeroRoll;


    targetPitch=0;
    targetRoll=0;

    displayPitch=0;
    displayRoll=0;


    statusBox.textContent=
        "ZERO gesetzt";
}


/* ==========================================================
   SWAP
========================================================== */

function swapAxes(){

    if(
        !haveMotion ||
        !gravity
    ){

        swapPitchRoll=
            !swapPitchRoll;

        updateSwapButton();

        statusBox.textContent=

            swapPitchRoll
            ?"Pitch=Z · Roll=X"
            :"Pitch=X · Roll=Z";

        return;
    }


    swapPitchRoll=
        !swapPitchRoll;


    setZero();

    updateSwapButton();


    statusBox.textContent=

        swapPitchRoll
        ?"Pitch=Z · Roll=X"
        :"Pitch=X · Roll=Z";
}


function updateSwapButton(){

    swapButton.textContent=

        swapPitchRoll
        ?"P↔R Z/X"
        :"P↔R X/Z";
}


/* ==========================================================
   START
========================================================== */

async function startSensors(){

    try{

        statusBox.textContent=
            "Sensorfreigabe…";


        if(
            typeof DeviceMotionEvent
            !== "undefined" &&

            typeof DeviceMotionEvent
            .requestPermission
            === "function"
        ){

            const permission=
                await DeviceMotionEvent
                .requestPermission();


            if(
                permission!=="granted"
            ){

                statusBox.textContent=
                    "Motion verweigert";

                return;
            }
        }


        if(
            typeof DeviceOrientationEvent
            !== "undefined" &&

            typeof DeviceOrientationEvent
            .requestPermission
            === "function"
        ){

            let permission;


            try{

                permission=
                    await DeviceOrientationEvent
                    .requestPermission(true);

            }catch{

                permission=
                    await DeviceOrientationEvent
                    .requestPermission();
            }


            if(
                permission!=="granted"
            ){

                statusBox.textContent=
                    "Kompass verweigert";

                return;
            }
        }


        window.addEventListener(
            "devicemotion",
            handleMotion,
            true
        );


        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );


        document
        .getElementById(
            "startButton"
        )
        .style
        .display=
            "none";


        statusBox.textContent=
            "Sensoren aktiv";


        setTimeout(
            function(){

                if(haveMotion){

                    setZero();

                    statusBox.textContent=

                        swapPitchRoll
                        ?"V6.5 · P=Z/R=X"
                        :"V6.5 · P=X/R=Z";
                }

            },
            1500
        );

    }

    catch(error){

        console.error(error);

        statusBox.textContent=
            "Fehler: "+
            error.message;
    }
}


/* ==========================================================
   PITCH LADDER
========================================================== */

const pitchMarks=[
    -40,-35,-30,-25,-20,-15,-10,-5,
      5, 10, 15, 20, 25, 30, 35, 40
];


for(
    const deg of pitchMarks
){

    const line=
        document.createElement(
            "div"
        );


    line.className=

        "pitchLine " +

        (
            Math.abs(deg)%10===0
            ?"ten"
            :"five"
        );


    const y=
        550 -
        deg *
        PX_PER_DEG;


    line.style.top=
        y+"px";


    ladder.appendChild(
        line
    );


    /*
       Grafikentwurf:
       Beschriftung bei
       5 / 10 / 15 / 20 / 30 / 40

       25 / 35 bleiben Hilfslinien.
    */

    const abs=
        Math.abs(deg);


    if(
        abs===5 ||
        abs===10 ||
        abs===15 ||
        abs===20 ||
        abs===30 ||
        abs===40
    ){

        const left=
            document.createElement(
                "div"
            );

        const right=
            document.createElement(
                "div"
            );


        left.className=
            "pitchLabel";

        right.className=
            "pitchLabel";


        left.textContent=
            abs;

        right.textContent=
            abs;


        left.style.top=
            (y-9)+"px";

        right.style.top=
            (y-9)+"px";


        left.style.left=
            "128px";

        right.style.right=
            "128px";


        ladder.appendChild(
            left
        );

        ladder.appendChild(
            right
        );
    }
}


/* ==========================================================
   ROLL SCALE
========================================================== */

const rollScale=
    document.getElementById(
        "rollScale"
    );


const rollMarks=[
    -60,-45,-30,-20,-10,
    0,
    10,20,30,45,60
];


for(
    const angle of rollMarks
){

    const tick=
        document.createElement(
            "div"
        );


    tick.className=
        "rollTick";


    if(
        angle===0 ||
        Math.abs(angle)===30 ||
        Math.abs(angle)===60
    ){

        tick.classList.add(
            "major"
        );

    }else if(
        Math.abs(angle)===45
    ){

        tick.classList.add(
            "medium"
        );
    }


    tick.style.transform=

        "rotate("+
        angle+
        "deg)";


    rollScale.appendChild(
        tick
    );


    if(angle!==0){

        const number=
            document.createElement(
                "div"
            );


        number.className=
            "rollNumber";


        number.textContent=
            Math.abs(angle);


        number.style.transform=

            "rotate("+
            angle+
            "deg)";


        rollScale.appendChild(
            number
        );
    }
}


/* ==========================================================
   HEADING TAPE
========================================================== */

const HEADING_PX_PER_DEG=3.7;


for(
    let deg=-360;
    deg<=720;
    deg+=5
){

    const normalized=
        ((deg%360)+360)%360;


    const mark=
        document.createElement(
            "div"
        );


    mark.className=

        "headingMark " +

        (
            normalized%10===0
            ?"ten"
            :""
        );


    mark.style.left=

        (
            deg *
            HEADING_PX_PER_DEG
        )+
        "px";


    headingTape.appendChild(
        mark
    );


    if(
        normalized%30===0
    ){

        const label=
            document.createElement(
                "div"
            );


        label.className=
            "headingLabel";


        if(normalized===0){

            label.textContent="N";

            label.classList.add(
                "cardinal"
            );

        }else if(normalized===90){

            label.textContent="E";

            label.classList.add(
                "cardinal"
            );

        }else if(normalized===180){

            label.textContent="S";

            label.classList.add(
                "cardinal"
            );

        }else if(normalized===270){

            label.textContent="W";

            label.classList.add(
                "cardinal"
            );

        }else{

            label.textContent=

                String(
                    normalized
                )
                .padStart(
                    3,
                    "0"
                );
        }


        label.style.left=

            (
                deg *
                HEADING_PX_PER_DEG
            )+
            "px";


        headingTape.appendChild(
            label
        );
    }
}


/* ==========================================================
   RENDER
========================================================== */

function render(){

    displayPitch=
        smooth(
            displayPitch,
            targetPitch,
            DISPLAY_FILTER
        );


    displayRoll=
        smooth(
            displayRoll,
            targetRoll,
            DISPLAY_FILTER
        );


    /*
       ATTITUDE MOVEMENT
    */

    horizon.style.transform=

        "translateY("+

        (
            displayPitch *
            PX_PER_DEG
        )+

        "px) rotate("+

        (
            -displayRoll
        )+

        "deg)";


    /*
       MOVING BANK INDEX
    */

    movingBank.style.transform=

        "translateX(-50%) rotate("+

        (
            -displayRoll
        )+

        "deg)";


    pitchValue.textContent=

        displayPitch
        .toFixed(1)+
        "°";


    rollValue.textContent=

        displayRoll
        .toFixed(1)+
        "°";


    /* ======================================================
       HEADING
    ====================================================== */

    if(haveHeading){

        displayHeading=

            smoothAngle(
                displayHeading,
                rawHeading,
                HEADING_FILTER
            );


        let heading=

            Math.round(
                displayHeading
            ) % 360;


        if(heading===0){
            heading=360;
        }


        const text=

            String(
                heading
            )
            .padStart(
                3,
                "0"
            );


        headingDataValue.textContent=
            text+"°";


        const center=
            headingBox.clientWidth/2;


        headingTape.style.transform=

            "translateX("+

            (
                center -
                displayHeading *
                HEADING_PX_PER_DEG
            )+

            "px)";
    }


    requestAnimationFrame(
        render
    );
}


render();


/* ==========================================================
   BUTTONS
========================================================== */

document
.getElementById(
    "startButton"
)
.addEventListener(
    "click",
    startSensors
);


document
.getElementById(
    "zeroButton"
)
.addEventListener(
    "click",
    setZero
);


document
.getElementById(
    "swapButton"
)
.addEventListener(
    "click",
    swapAxes
);


document
.getElementById(
    "debugButton"
)
.addEventListener(
    "click",
    function(){

        debugVisible=
            !debugVisible;


        debugBox.style.display=

            debugVisible
            ?"block"
            :"none";
    }
);


updateSwapButton();

</script>
