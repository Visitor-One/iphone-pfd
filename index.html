<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">

<title>iPhone PFD V3</title>

<style>

* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

#pfd {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}

/* ==========================================
   HORIZON
   ========================================== */

#attitudeViewport {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

#horizon {
    position: absolute;

    width: 300vw;
    height: 300vh;

    left: 50%;
    top: 50%;

    margin-left: -150vw;
    margin-top: -150vh;

    transform-origin: center center;

    background:
        linear-gradient(
            to bottom,
            #168bc0 0%,
            #168bc0 49.8%,
            #ffffff 49.8%,
            #ffffff 50.2%,
            #814326 50.2%,
            #814326 100%
        );
}

/* ==========================================
   PITCH LADDER
   ========================================== */

#pitchLadder {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 500px;
    height: 900px;

    transform: translate(-50%, -50%);
}

.pitchLine {
    position: absolute;

    left: 50%;

    height: 2px;

    background: white;

    transform: translateX(-50%);

    box-shadow:
        0 0 2px black;
}

.pitchLine.major {
    width: 120px;
}

.pitchLine.minor {
    width: 65px;
}

.pitchLabel {
    position: absolute;

    color: white;

    font-size: 17px;
    font-weight: 600;

    text-shadow:
        1px 1px 2px black;
}

/* ==========================================
   AIRCRAFT
   ========================================== */

#aircraft {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 270px;
    height: 60px;

    transform:
        translate(-50%, -50%);

    z-index: 20;
}

.wing {
    position: absolute;

    top: 28px;

    width: 100px;
    height: 5px;

    background: #ffd900;

    border: 1px solid black;
}

.wing.left {
    left: 0;
}

.wing.right {
    right: 0;
}

.wing.left::after,
.wing.right::after {

    content: "";

    position: absolute;

    width: 5px;
    height: 20px;

    background: #ffd900;

    top: -15px;
}

.wing.left::after {
    right: 0;
}

.wing.right::after {
    left: 0;
}

#aircraftCenter {

    position: absolute;

    width: 18px;
    height: 18px;

    border:
        3px solid #ffd900;

    border-radius: 50%;

    left: 50%;
    top: 21px;

    transform:
        translateX(-50%);
}

/* ==========================================
   HEADING
   ========================================== */

#headingBox {

    position: absolute;

    top:
        env(safe-area-inset-top);

    left: 50%;

    transform:
        translateX(-50%);

    width: 72%;
    height: 70px;

    overflow: hidden;

    background:
        rgba(0,0,0,.58);

    border-bottom:
        1px solid #aaa;

    z-index: 50;
}

#headingTape {

    position: absolute;

    top: 0;

    height: 100%;
}

.headingMark {

    position: absolute;

    top: 34px;

    width: 2px;
    height: 12px;

    background: white;
}

.headingMark.major {
    height: 21px;
}

.headingLabel {

    position: absolute;

    top: 5px;

    transform:
        translateX(-50%);

    font-size: 17px;
    font-weight: 600;
}

#headingPointer {

    position: absolute;

    left: 50%;
    bottom: 0;

    transform:
        translateX(-50%);

    width: 0;
    height: 0;

    border-left:
        8px solid transparent;

    border-right:
        8px solid transparent;

    border-bottom:
        12px solid #ffd900;

    z-index: 60;
}

#headingValue {

    position: absolute;

    left: 50%;

    top:
        calc(
            73px +
            env(safe-area-inset-top)
        );

    transform:
        translateX(-50%);

    background: #000;

    border:
        2px solid #00ff65;

    color: #00ff65;

    padding:
        3px 10px;

    font-size: 21px;
    font-weight: bold;

    z-index: 60;
}

/* ==========================================
   DATA BOXES
   ========================================== */

.dataBox {

    position: absolute;

    bottom:
        calc(
            12px +
            env(safe-area-inset-bottom)
        );

    background:
        rgba(0,0,0,.72);

    border:
        1px solid #777;

    padding:
        7px 10px;

    font-family:
        Menlo, monospace;

    font-size: 13px;

    z-index: 60;
}

#pitchBox {
    left: 10px;
}

#rollBox {
    left: 125px;
}

#compassBox {
    right: 10px;
}

/* ==========================================
   CONTROLS
   ========================================== */

#controls {

    position: absolute;

    right: 10px;

    top:
        calc(
            88px +
            env(safe-area-inset-top)
        );

    z-index: 100;

    display: flex;

    flex-direction: column;

    gap: 7px;
}

button {

    appearance: none;

    border:
        1px solid #aaa;

    border-radius: 7px;

    background:
        rgba(0,0,0,.78);

    color: white;

    padding:
        9px 12px;

    font-size: 13px;

    font-weight: 600;
}

#startButton {

    color: #00ff65;

    border-color: #00ff65;
}

/* ==========================================
   STATUS
   ========================================== */

#status {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            50px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    background:
        rgba(0,0,0,.72);

    padding:
        5px 9px;

    border-radius: 5px;

    font-size: 11px;

    z-index: 100;
}

/* ==========================================
   DEBUG
   ========================================== */

#debug {

    position: absolute;

    left: 10px;
    top: 100px;

    background:
        rgba(0,0,0,.60);

    color: #00ff65;

    font-family:
        Menlo, monospace;

    font-size: 10px;

    padding: 5px;

    z-index: 100;

    display: none;
}

</style>
</head>

<body>

<div id="pfd">

    <div id="attitudeViewport">

        <div id="horizon">

            <div id="pitchLadder"></div>

        </div>

    </div>


    <div id="aircraft">

        <div class="wing left"></div>

        <div id="aircraftCenter"></div>

        <div class="wing right"></div>

    </div>


    <div id="headingBox">

        <div id="headingTape"></div>

        <div id="headingPointer"></div>

    </div>


    <div id="headingValue">
        ---
    </div>


    <div id="controls">

        <button id="startButton">
            SENSOREN STARTEN
        </button>

        <button id="zeroButton">
            ZERO
        </button>

        <button id="debugButton">
            DEBUG
        </button>

        <button id="fullscreenButton">
            VOLLBILD
        </button>

    </div>


    <div
        id="pitchBox"
        class="dataBox">

        PITCH
        <span id="pitchValue">
            0.0°
        </span>

    </div>


    <div
        id="rollBox"
        class="dataBox">

        ROLL
        <span id="rollValue">
            0.0°
        </span>

    </div>


    <div
        id="compassBox"
        class="dataBox">

        HDG
        <span id="compassValue">
            ---
        </span>

    </div>


    <div id="status">
        Sensoren nicht gestartet
    </div>


    <div id="debug">
        DEBUG
    </div>

</div>


<script>

/* ==========================================================
   CONFIG
   ========================================================== */

const DEG =
    180 / Math.PI;

const RAD =
    Math.PI / 180;

const PX_PER_DEG =
    7;


/*
   Filter.

   0.10 = sehr weich
   0.20 = guter Kompromiss
   0.40 = sehr direkt
*/

const FILTER =
    0.18;

const HEADING_FILTER =
    0.10;


/* ==========================================================
   ELEMENTS
   ========================================================== */

const horizon =
    document.getElementById(
        "horizon"
    );

const pitchLadder =
    document.getElementById(
        "pitchLadder"
    );

const pitchValue =
    document.getElementById(
        "pitchValue"
    );

const rollValue =
    document.getElementById(
        "rollValue"
    );

const compassValue =
    document.getElementById(
        "compassValue"
    );

const headingValue =
    document.getElementById(
        "headingValue"
    );

const headingTape =
    document.getElementById(
        "headingTape"
    );

const headingBox =
    document.getElementById(
        "headingBox"
    );

const statusBox =
    document.getElementById(
        "status"
    );

const debugBox =
    document.getElementById(
        "debug"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const zeroButton =
    document.getElementById(
        "zeroButton"
    );

const debugButton =
    document.getElementById(
        "debugButton"
    );

const fullscreenButton =
    document.getElementById(
        "fullscreenButton"
    );


/* ==========================================================
   SENSOR STATE
   ========================================================== */

let gravityX = 0;
let gravityY = 0;
let gravityZ = 0;

let haveGravity =
    false;


/*
   Absolute Lage aus Gravity
*/

let rawPitch = 0;
let rawRoll = 0;


/*
   ZERO-Referenz
*/

let zeroPitch = 0;
let zeroRoll = 0;


/*
   Zielwerte nach ZERO
*/

let targetPitch = 0;
let targetRoll = 0;


/*
   Angezeigte Werte
*/

let displayPitch = 0;
let displayRoll = 0;


/*
   Heading
*/

let rawHeading = 0;
let displayHeading = 0;

let haveHeading =
    false;


/*
   Debug
*/

let debugVisible =
    false;


/* ==========================================================
   SCREEN ORIENTATION
   ========================================================== */

function getScreenAngle() {

    if (
        screen.orientation &&
        typeof screen.orientation.angle
            === "number"
    ) {

        return (
            screen.orientation.angle +
            360
        ) % 360;
    }


    if (
        typeof window.orientation
            === "number"
    ) {

        return (
            window.orientation +
            360
        ) % 360;
    }


    return 0;
}


/* ==========================================================
   GRAVITY → SCREEN COORDINATES
   ========================================================== */

/*
   DeviceMotion liefert x/y bezogen auf das
   physische Gerät.

   Wir drehen diesen Vektor zunächst in die
   aktuelle Bildschirmorientierung.

   Danach gilt unabhängig davon, wie iOS die
   Device-Achsen intern bezeichnet:

       sx = links / rechts
       sy = oben / unten
       sz = senkrecht zum Display
*/

function gravityToScreen(
    x,
    y,
    z
) {

    const angle =
        getScreenAngle();


    let sx;
    let sy;


    switch(angle) {

        case 90:

            sx = -y;
            sy = x;

            break;


        case 270:

            sx = y;
            sy = -x;

            break;


        case 180:

            sx = -x;
            sy = -y;

            break;


        default:

            sx = x;
            sy = y;

            break;
    }


    return {

        x: sx,

        y: sy,

        z: z
    };
}


/* ==========================================================
   GRAVITY → PITCH / ROLL
   ========================================================== */

/*
   Der entscheidende Unterschied zu V2:

   Pitch und Roll werden NICHT aus
   DeviceOrientation-Eulerwinkeln berechnet.

   Wir benutzen nur die Richtung der
   Schwerkraft.

   Dadurch hat eine Änderung des Heading
   keinerlei Einfluss auf Pitch/Roll.
*/

function gravityToAttitude(
    x,
    y,
    z
) {

    /*
       Normieren
    */

    const length =
        Math.sqrt(
            x*x +
            y*y +
            z*z
        );


    if (length < 0.001) {

        return null;
    }


    x /= length;
    y /= length;
    z /= length;


    /*
       Roll

       atan2 vermeidet die problematische
       Euler-Kopplung.

       x = seitlicher Anteil
       z = Display-Normale
    */

    const roll =
        Math.atan2(
            -x,
            -z
        ) * DEG;


    /*
       Pitch

       y wird gegen die Länge der
       x/z-Komponenten berechnet.

       Dadurch bleibt Pitch auch bei Roll
       mathematisch sauber definiert.
    */

    const pitch =
        Math.atan2(
            y,
            Math.sqrt(
                x*x +
                z*z
            )
        ) * DEG;


    return {

        pitch: pitch,

        roll: roll
    };
}


/* ==========================================================
   DEVICE MOTION
   ========================================================== */

function handleMotion(event) {

    const g =
        event.accelerationIncludingGravity;


    if (!g) {

        return;
    }


    if (
        g.x == null ||
        g.y == null ||
        g.z == null
    ) {

        return;
    }


    gravityX =
        g.x;

    gravityY =
        g.y;

    gravityZ =
        g.z;


    const screenGravity =
        gravityToScreen(
            gravityX,
            gravityY,
            gravityZ
        );


    const attitude =
        gravityToAttitude(
            screenGravity.x,
            screenGravity.y,
            screenGravity.z
        );


    if (!attitude) {

        return;
    }


    rawPitch =
        attitude.pitch;

    rawRoll =
        attitude.roll;


    /*
       Relative Werte zur ZERO-Lage
    */

    targetPitch =
        rawPitch -
        zeroPitch;

    targetRoll =
        normalize180(
            rawRoll -
            zeroRoll
        );


    haveGravity =
        true;


    /*
       Debug
    */

    if (debugVisible) {

        debugBox.innerHTML =

            "SCREEN: " +
            getScreenAngle() +
            "°<br>" +

            "GX: " +
            gravityX.toFixed(2) +
            "<br>" +

            "GY: " +
            gravityY.toFixed(2) +
            "<br>" +

            "GZ: " +
            gravityZ.toFixed(2) +
            "<br><br>" +

            "SX: " +
            screenGravity.x.toFixed(2) +
            "<br>" +

            "SY: " +
            screenGravity.y.toFixed(2) +
            "<br>" +

            "SZ: " +
            screenGravity.z.toFixed(2) +
            "<br><br>" +

            "RAW P: " +
            rawPitch.toFixed(1) +
            "°<br>" +

            "RAW R: " +
            rawRoll.toFixed(1) +
            "°";
    }
}


/* ==========================================================
   HEADING
   ========================================================== */

function handleOrientation(
    event
) {

    /*
       Safari / iPhone liefert hierfür
       webkitCompassHeading.

       Pitch und Roll benutzen wir aus
       diesem Event ABSICHTLICH nicht.
    */

    if (
        typeof
            event.webkitCompassHeading
            === "number" &&

        !Number.isNaN(
            event.webkitCompassHeading
        )
    ) {

        rawHeading =
            event.webkitCompassHeading;

        haveHeading =
            true;

        return;
    }


    /*
       Fallback
    */

    if (
        typeof event.alpha
            === "number"
    ) {

        rawHeading =
            (
                360 -
                event.alpha
            ) % 360;

        haveHeading =
            true;
    }
}


/* ==========================================================
   ANGLE HELPERS
   ========================================================== */

function normalize180(
    angle
) {

    while (
        angle > 180
    ) {

        angle -= 360;
    }


    while (
        angle < -180
    ) {

        angle += 360;
    }


    return angle;
}


/* ==========================================================
   FILTER
   ========================================================== */

function smooth(
    current,
    target,
    factor
) {

    return (
        current +
        (
            target -
            current
        ) *
        factor
    );
}


function smoothAngle(
    current,
    target,
    factor
) {

    const delta =
        (
            (
                target -
                current +
                540
            ) % 360
        ) - 180;


    return (
        current +
        delta *
        factor +
        360
    ) % 360;
}


/* ==========================================================
   SENSOR START
   ========================================================== */

async function startSensors() {

    try {

        statusBox.textContent =
            "Sensorfreigabe…";


        /*
           DeviceMotion Permission
        */

        if (
            typeof DeviceMotionEvent
                !== "undefined" &&

            typeof DeviceMotionEvent
                .requestPermission
                === "function"
        ) {

            const motionPermission =
                await DeviceMotionEvent
                    .requestPermission();


            if (
                motionPermission
                    !== "granted"
            ) {

                statusBox.textContent =
                    "Motion-Zugriff verweigert";

                return;
            }
        }


        /*
           DeviceOrientation Permission
        */

        if (
            typeof DeviceOrientationEvent
                !== "undefined" &&

            typeof DeviceOrientationEvent
                .requestPermission
                === "function"
        ) {

            let orientationPermission;


            try {

                orientationPermission =
                    await DeviceOrientationEvent
                        .requestPermission(true);

            }

            catch {

                orientationPermission =
                    await DeviceOrientationEvent
                        .requestPermission();
            }


            if (
                orientationPermission
                    !== "granted"
            ) {

                statusBox.textContent =
                    "Kompass-Zugriff verweigert";

                return;
            }
        }


        /*
           Listener
        */

        window.addEventListener(
            "devicemotion",
            handleMotion,
            true
        );


        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );


        startButton.style.display =
            "none";


        statusBox.textContent =
            "Sensoren aktiv";


        /*
           Nach kurzer Zeit automatisch
           ZERO setzen.
        */

        setTimeout(
            function() {

                if (haveGravity) {

                    setZero();

                    statusBox.textContent =
                        "Sensoren aktiv · AUTO ZERO";
                }

            },
            500
        );

    }

    catch(error) {

        console.error(error);


        statusBox.textContent =
            "Fehler: " +
            error.message;
    }
}


/* ==========================================================
   ZERO
   ========================================================== */

function setZero() {

    if (!haveGravity) {

        statusBox.textContent =
            "Noch keine Bewegungsdaten";

        return;
    }


    zeroPitch =
        rawPitch;

    zeroRoll =
        rawRoll;


    targetPitch = 0;
    targetRoll = 0;

    displayPitch = 0;
    displayRoll = 0;


    statusBox.textContent =
        "ZERO gesetzt";
}


/* ==========================================================
   PITCH LADDER
   ========================================================== */

function createPitchLadder() {

    for (
        let deg = -40;
        deg <= 40;
        deg += 5
    ) {

        if (
            deg === 0
        ) {

            continue;
        }


        const line =
            document.createElement(
                "div"
            );


        line.className =

            "pitchLine " +

            (
                deg % 10 === 0
                ? "major"
                : "minor"
            );


        const y =
            450 -
            deg *
            PX_PER_DEG;


        line.style.top =
            y + "px";


        pitchLadder
            .appendChild(
                line
            );


        if (
            deg % 10 === 0
        ) {

            const left =
                document.createElement(
                    "div"
                );

            const right =
                document.createElement(
                    "div"
                );


            left.className =
                "pitchLabel";

            right.className =
                "pitchLabel";


            left.textContent =
                Math.abs(deg);

            right.textContent =
                Math.abs(deg);


            left.style.top =
                (y - 10) +
                "px";

            right.style.top =
                (y - 10) +
                "px";


            left.style.left =
                "145px";

            right.style.right =
                "145px";


            pitchLadder
                .appendChild(
                    left
                );

            pitchLadder
                .appendChild(
                    right
                );
        }
    }
}


createPitchLadder();


/* ==========================================================
   HEADING TAPE
   ========================================================== */

const HEADING_PX_PER_DEG =
    5;


function createHeadingTape() {

    for (
        let deg = -360;
        deg <= 720;
        deg += 5
    ) {

        const normalized =
            (
                (
                    deg % 360
                ) +
                360
            ) % 360;


        const mark =
            document.createElement(
                "div"
            );


        mark.className =

            "headingMark " +

            (
                normalized % 10 === 0
                ? "major"
                : ""
            );


        mark.style.left =

            (
                deg *
                HEADING_PX_PER_DEG
            ) +
            "px";


        headingTape
            .appendChild(
                mark
            );


        if (
            normalized % 30 === 0
        ) {

            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "headingLabel";


            if (
                normalized === 0
            ) {

                label.textContent =
                    "N";
            }

            else if (
                normalized === 90
            ) {

                label.textContent =
                    "E";
            }

            else if (
                normalized === 180
            ) {

                label.textContent =
                    "S";
            }

            else if (
                normalized === 270
            ) {

                label.textContent =
                    "W";
            }

            else {

                label.textContent =
                    String(
                        normalized / 10
                    )
                    .padStart(
                        2,
                        "0"
                    );
            }


            label.style.left =

                (
                    deg *
                    HEADING_PX_PER_DEG
                ) +
                "px";


            headingTape
                .appendChild(
                    label
                );
        }
    }
}


createHeadingTape();


/* ==========================================================
   DEBUG
   ========================================================== */

function toggleDebug() {

    debugVisible =
        !debugVisible;


    debugBox.style.display =
        debugVisible
        ? "block"
        : "none";
}


/* ==========================================================
   FULLSCREEN
   ========================================================== */

async function fullscreen() {

    try {

        if (
            document.documentElement
                .requestFullscreen
        ) {

            await document
                .documentElement
                .requestFullscreen();
        }
    }

    catch(error) {

        console.log(error);
    }
}


/* ==========================================================
   RENDER
   ========================================================== */

function render() {

    /*
       Filter
    */

    displayPitch =
        smooth(
            displayPitch,
            targetPitch,
            FILTER
        );


    displayRoll =
        smooth(
            displayRoll,
            targetRoll,
            FILTER
        );


    /*
       Heading
    */

    if (
        haveHeading
    ) {

        displayHeading =
            smoothAngle(
                displayHeading,
                rawHeading,
                HEADING_FILTER
            );
    }


    /*
       Horizont

       Nose UP:
       Horizont bewegt sich nach unten.

       Roll rechts:
       Horizont dreht entgegengesetzt.
    */

    const pitchPixels =

        displayPitch *
        PX_PER_DEG;


    horizon.style.transform =

        "translateY(" +
        pitchPixels +
        "px) " +

        "rotate(" +
        (-displayRoll) +
        "deg)";


    /*
       Zahlen
    */

    pitchValue.textContent =

        displayPitch
            .toFixed(1) +
        "°";


    rollValue.textContent =

        displayRoll
            .toFixed(1) +
        "°";


    /*
       Heading
    */

    if (
        haveHeading
    ) {

        let heading =

            Math.round(
                displayHeading
            ) % 360;


        if (
            heading === 0
        ) {

            heading =
                360;
        }


        const headingText =

            String(
                heading
            )
            .padStart(
                3,
                "0"
            );


        headingValue
            .textContent =
            headingText;


        compassValue
            .textContent =

            headingText +
            "°";


        const center =

            headingBox
                .clientWidth /
            2;


        headingTape
            .style
            .transform =

            "translateX(" +

            (
                center -
                displayHeading *
                HEADING_PX_PER_DEG
            ) +

            "px)";
    }


    requestAnimationFrame(
        render
    );
}


render();


/* ==========================================================
   BUTTONS
   ========================================================== */

startButton
    .addEventListener(
        "click",
        startSensors
    );


zeroButton
    .addEventListener(
        "click",
        setZero
    );


debugButton
    .addEventListener(
        "click",
        toggleDebug
    );


fullscreenButton
    .addEventListener(
        "click",
        fullscreen
    );

</script>

</body>
