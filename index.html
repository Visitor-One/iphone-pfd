<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">

<title>iPhone PFD</title>

<style>
* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

#pfd {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}

/* ================= HORIZON ================= */

#attitudeViewport {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

#horizon {
    position: absolute;
    width: 300vw;
    height: 300vh;
    left: 50%;
    top: 50%;
    margin-left: -150vw;
    margin-top: -150vh;
    transform-origin: center;

    background:
        linear-gradient(
            to bottom,
            #1589bd 0%,
            #1589bd 49.85%,
            #fff 49.85%,
            #fff 50.15%,
            #754126 50.15%,
            #754126 100%
        );
}

#pitchLadder {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 500px;
    height: 900px;
    transform: translate(-50%, -50%);
}

.pitchLine {
    position: absolute;
    left: 50%;
    height: 2px;
    background: white;
    transform: translateX(-50%);
    box-shadow: 0 0 2px #000;
}

.pitchLine.major { width: 120px; }
.pitchLine.minor { width: 65px; }

.pitchLabel {
    position: absolute;
    color: white;
    font-size: 17px;
    font-weight: 600;
    text-shadow: 1px 1px 2px #000;
}

/* ================= AIRCRAFT ================= */

#aircraft {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 270px;
    height: 60px;
    transform: translate(-50%, -50%);
    z-index: 20;
}

.wing {
    position: absolute;
    top: 28px;
    width: 100px;
    height: 5px;
    background: #ffd900;
    border: 1px solid #000;
}

.wing.left { left: 0; }
.wing.right { right: 0; }

.wing.left::after,
.wing.right::after {
    content: "";
    position: absolute;
    width: 5px;
    height: 20px;
    background: #ffd900;
    top: -15px;
}

.wing.left::after { right: 0; }
.wing.right::after { left: 0; }

#aircraftCenter {
    position: absolute;
    width: 18px;
    height: 18px;
    border: 3px solid #ffd900;
    border-radius: 50%;
    left: 50%;
    top: 21px;
    transform: translateX(-50%);
}

/* ================= HEADING ================= */

#headingBox {
    position: absolute;
    top: env(safe-area-inset-top);
    left: 50%;
    transform: translateX(-50%);
    width: 72%;
    height: 70px;
    overflow: hidden;
    background: rgba(0,0,0,.58);
    border-bottom: 1px solid #aaa;
    z-index: 50;
}

#headingTape {
    position: absolute;
    top: 0;
    height: 100%;
}

.headingMark {
    position: absolute;
    top: 34px;
    width: 2px;
    height: 12px;
    background: white;
}

.headingMark.major {
    height: 21px;
}

.headingLabel {
    position: absolute;
    top: 5px;
    transform: translateX(-50%);
    font-size: 17px;
    font-weight: 600;
}

#headingPointer {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 12px solid #ffd900;
    z-index: 60;
}

#headingValue {
    position: absolute;
    left: 50%;
    top: calc(73px + env(safe-area-inset-top));
    transform: translateX(-50%);
    background: #000;
    border: 2px solid #00ff65;
    color: #00ff65;
    padding: 3px 10px;
    font-size: 21px;
    font-weight: bold;
    z-index: 60;
}

/* ================= DATA ================= */

.dataBox {
    position: absolute;
    bottom: calc(12px + env(safe-area-inset-bottom));
    background: rgba(0,0,0,.7);
    border: 1px solid #777;
    padding: 7px 10px;
    font-family: Menlo, monospace;
    font-size: 13px;
    z-index: 60;
}

#pitchBox { left: 10px; }
#rollBox { left: 125px; }
#compassBox { right: 10px; }

/* ================= CONTROLS ================= */

#controls {
    position: absolute;
    right: 10px;
    top: calc(88px + env(safe-area-inset-top));
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

button {
    appearance: none;
    border: 1px solid #aaa;
    border-radius: 7px;
    background: rgba(0,0,0,.75);
    color: white;
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 600;
}

#startButton {
    color: #00ff65;
    border-color: #00ff65;
}

#status {
    position: absolute;
    left: 50%;
    bottom: calc(50px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: rgba(0,0,0,.72);
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 11px;
    z-index: 100;
}

#shade {
    pointer-events: none;
    position: absolute;
    inset: 0;
    z-index: 40;
    background: radial-gradient(
        ellipse at center,
        transparent 48%,
        rgba(0,0,0,.25) 100%
    );
}
</style>
</head>

<body>

<div id="pfd">

    <div id="attitudeViewport">
        <div id="horizon">
            <div id="pitchLadder"></div>
        </div>
    </div>

    <div id="aircraft">
        <div class="wing left"></div>
        <div id="aircraftCenter"></div>
        <div class="wing right"></div>
    </div>

    <div id="headingBox">
        <div id="headingTape"></div>
        <div id="headingPointer"></div>
    </div>

    <div id="headingValue">---</div>

    <div id="controls">
        <button id="startButton">SENSOREN STARTEN</button>
        <button id="zeroButton">ZERO</button>
        <button id="fullscreenButton">VOLLBILD</button>
    </div>

    <div id="pitchBox" class="dataBox">
        PITCH <span id="pitchValue">0.0°</span>
    </div>

    <div id="rollBox" class="dataBox">
        ROLL <span id="rollValue">0.0°</span>
    </div>

    <div id="compassBox" class="dataBox">
        HDG <span id="compassValue">---</span>
    </div>

    <div id="status">Sensoren nicht gestartet</div>

    <div id="shade"></div>

</div>

<script>

/* =========================================================
   CONFIG
   ========================================================= */

const PX_PER_DEG = 7;
const ATTITUDE_SMOOTHING = 0.18;
const HEADING_SMOOTHING = 0.10;


/* =========================================================
   ELEMENTS
   ========================================================= */

const horizon = document.getElementById("horizon");
const pitchLadder = document.getElementById("pitchLadder");

const pitchValue = document.getElementById("pitchValue");
const rollValue = document.getElementById("rollValue");
const compassValue = document.getElementById("compassValue");

const headingTape = document.getElementById("headingTape");
const headingValue = document.getElementById("headingValue");

const startButton = document.getElementById("startButton");
const zeroButton = document.getElementById("zeroButton");
const fullscreenButton = document.getElementById("fullscreenButton");

const statusBox = document.getElementById("status");


/* =========================================================
   STATE
   ========================================================= */

let currentQuaternion = null;
let zeroQuaternion = null;

let targetPitch = 0;
let targetRoll = 0;

let displayPitch = 0;
let displayRoll = 0;

let rawHeading = 0;
let displayHeading = 0;

let haveHeading = false;


/* =========================================================
   MATH
   ========================================================= */

const DEG = Math.PI / 180;


/*
   Quaternion aus DeviceOrientation Euler-Winkeln.

   DeviceOrientation:
   alpha = Z
   beta  = X
   gamma = Y
*/

function quaternionFromEuler(alpha, beta, gamma) {

    const x = beta  * DEG / 2;
    const y = gamma * DEG / 2;
    const z = alpha * DEG / 2;

    const cx = Math.cos(x);
    const sx = Math.sin(x);

    const cy = Math.cos(y);
    const sy = Math.sin(y);

    const cz = Math.cos(z);
    const sz = Math.sin(z);

    return {
        w:
            cx * cy * cz -
            sx * sy * sz,

        x:
            sx * cy * cz -
            cx * sy * sz,

        y:
            cx * sy * cz +
            sx * cy * sz,

        z:
            cx * cy * sz +
            sx * sy * cz
    };
}


function quatConjugate(q) {

    return {
        w: q.w,
        x: -q.x,
        y: -q.y,
        z: -q.z
    };
}


function quatMultiply(a, b) {

    return {

        w:
            a.w*b.w -
            a.x*b.x -
            a.y*b.y -
            a.z*b.z,

        x:
            a.w*b.x +
            a.x*b.w +
            a.y*b.z -
            a.z*b.y,

        y:
            a.w*b.y -
            a.x*b.z +
            a.y*b.w +
            a.z*b.x,

        z:
            a.w*b.z +
            a.x*b.y -
            a.y*b.x +
            a.z*b.w
    };
}


function normalizeQuaternion(q) {

    const n = Math.sqrt(
        q.w*q.w +
        q.x*q.x +
        q.y*q.y +
        q.z*q.z
    );

    return {
        w: q.w/n,
        x: q.x/n,
        y: q.y/n,
        z: q.z/n
    };
}


/*
   Quaternion -> relative Euler-Winkel.

   Für unser PFD interessieren uns
   die Bewegungen relativ zur ZERO-Lage.
*/

function quaternionToAttitude(q) {

    q = normalizeQuaternion(q);

    /*
       X rotation
    */

    const sinr =
        2 * (
            q.w*q.x +
            q.y*q.z
        );

    const cosr =
        1 -
        2 * (
            q.x*q.x +
            q.y*q.y
        );

    const xAngle =
        Math.atan2(sinr, cosr);


    /*
       Y rotation
    */

    let sinp =
        2 * (
            q.w*q.y -
            q.z*q.x
        );

    sinp =
        Math.max(-1, Math.min(1, sinp));

    const yAngle =
        Math.asin(sinp);


    return {
        x: xAngle / DEG,
        y: yAngle / DEG
    };
}


/* =========================================================
   SCREEN ORIENTATION
   ========================================================= */

function getScreenAngle() {

    if (
        screen.orientation &&
        typeof screen.orientation.angle === "number"
    ) {
        return screen.orientation.angle;
    }

    return window.orientation || 0;
}


/*
   Wir korrigieren die Sensordaten auf die
   aktuelle Bildschirmorientierung.

   Das ist entscheidend, weil das PFD
   im Landscape-Modus benutzt wird.
*/

function applyScreenOrientation(q) {

    const angle = getScreenAngle();

    const half =
        (-angle * DEG) / 2;

    const screenQ = {
        w: Math.cos(half),
        x: 0,
        y: 0,
        z: Math.sin(half)
    };

    return quatMultiply(q, screenQ);
}


/* =========================================================
   PITCH LADDER
   ========================================================= */

function createPitchLadder() {

    for (
        let deg = -40;
        deg <= 40;
        deg += 5
    ) {

        if (deg === 0)
            continue;

        const line =
            document.createElement("div");

        line.className =
            "pitchLine " +
            (
                deg % 10 === 0
                ? "major"
                : "minor"
            );

        const y =
            450 -
            deg * PX_PER_DEG;

        line.style.top =
            y + "px";

        pitchLadder.appendChild(line);


        if (deg % 10 === 0) {

            const l =
                document.createElement("div");

            const r =
                document.createElement("div");

            l.className =
                "pitchLabel";

            r.className =
                "pitchLabel";

            l.textContent =
                Math.abs(deg);

            r.textContent =
                Math.abs(deg);

            l.style.top =
                (y - 10) + "px";

            r.style.top =
                (y - 10) + "px";

            l.style.left =
                "145px";

            r.style.right =
                "145px";

            pitchLadder.appendChild(l);
            pitchLadder.appendChild(r);
        }
    }
}

createPitchLadder();


/* =========================================================
   HEADING TAPE
   ========================================================= */

const HEADING_PX_PER_DEG = 5;

function createHeadingTape() {

    for (
        let deg = -360;
        deg <= 720;
        deg += 5
    ) {

        const n =
            ((deg % 360) + 360) % 360;

        const mark =
            document.createElement("div");

        mark.className =
            "headingMark " +
            (
                n % 10 === 0
                ? "major"
                : ""
            );

        mark.style.left =
            (deg *
             HEADING_PX_PER_DEG) +
            "px";

        headingTape.appendChild(mark);


        if (n % 30 === 0) {

            const label =
                document.createElement("div");

            label.className =
                "headingLabel";

            if (n === 0)
                label.textContent = "N";

            else if (n === 90)
                label.textContent = "E";

            else if (n === 180)
                label.textContent = "S";

            else if (n === 270)
                label.textContent = "W";

            else
                label.textContent =
                    String(n / 10)
                    .padStart(2, "0");


            label.style.left =
                (deg *
                 HEADING_PX_PER_DEG) +
                "px";

            headingTape.appendChild(label);
        }
    }
}

createHeadingTape();


/* =========================================================
   FILTER
   ========================================================= */

function smooth(current, target, factor) {

    return (
        current +
        (target-current) * factor
    );
}


function smoothAngle(current, target, factor) {

    const delta =
        (
            (
                target -
                current +
                540
            ) % 360
        ) - 180;

    return (
        current +
        delta * factor +
        360
    ) % 360;
}


/* =========================================================
   ORIENTATION EVENT
   ========================================================= */

function handleOrientation(event) {

    if (
        event.alpha == null ||
        event.beta == null ||
        event.gamma == null
    ) {
        return;
    }


    let q =
        quaternionFromEuler(
            event.alpha,
            event.beta,
            event.gamma
        );


    q =
        applyScreenOrientation(q);

    q =
        normalizeQuaternion(q);


    currentQuaternion = q;


    /*
       Beim ersten gültigen Sensorwert
       automatisch aktuelle Position
       als Null verwenden.
    */

    if (!zeroQuaternion) {

        zeroQuaternion =
            {...currentQuaternion};

        statusBox.textContent =
            "AUTO ZERO gesetzt";
    }


    /*
       Relative Lage:

       ZERO^-1 × CURRENT
    */

    const relative =
        quatMultiply(
            quatConjugate(zeroQuaternion),
            currentQuaternion
        );


    const attitude =
        quaternionToAttitude(relative);


    /*
       PFD-Zuordnung im Landscape-Modus.

       Falls ein bestimmtes Gerät die
       Vorzeichen anders liefert, können
       wir diese beiden Stellen einfach
       invertieren.
    */

    targetRoll =
        attitude.x;

    targetPitch =
        -attitude.y;


    /*
       Apple-Kompass
    */

    if (
        typeof event.webkitCompassHeading ===
            "number" &&
        !Number.isNaN(
            event.webkitCompassHeading
        )
    ) {

        rawHeading =
            event.webkitCompassHeading;

        haveHeading = true;
    }

    else if (
        typeof event.alpha === "number"
    ) {

        rawHeading =
            (
                360 -
                event.alpha
            ) % 360;

        haveHeading = true;
    }
}


/* =========================================================
   SENSOR START
   ========================================================= */

async function startSensors() {

    try {

        if (
            typeof DeviceOrientationEvent ===
            "undefined"
        ) {

            statusBox.textContent =
                "Orientation API nicht verfügbar";

            return;
        }


        if (
            typeof DeviceOrientationEvent
                .requestPermission ===
            "function"
        ) {

            statusBox.textContent =
                "Sensorfreigabe…";

            let permission;

            try {

                permission =
                    await DeviceOrientationEvent
                        .requestPermission(true);

            }
            catch {

                permission =
                    await DeviceOrientationEvent
                        .requestPermission();
            }


            if (
                permission !== "granted"
            ) {

                statusBox.textContent =
                    "Sensorzugriff verweigert";

                return;
            }
        }


        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );


        startButton.style.display =
            "none";

        statusBox.textContent =
            "Sensoren aktiv";

    }
    catch(error) {

        console.error(error);

        statusBox.textContent =
            "Fehler: " +
            error.message;
    }
}


/* =========================================================
   ZERO
   ========================================================= */

function zeroAttitude() {

    if (!currentQuaternion) {

        statusBox.textContent =
            "Noch keine Sensordaten";

        return;
    }


    zeroQuaternion =
        {...currentQuaternion};

    targetPitch = 0;
    targetRoll = 0;

    displayPitch = 0;
    displayRoll = 0;

    statusBox.textContent =
        "ZERO gesetzt";
}


/* =========================================================
   FULLSCREEN
   ========================================================= */

async function fullscreen() {

    try {

        if (
            document.documentElement
                .requestFullscreen
        ) {

            await document
                .documentElement
                .requestFullscreen();
        }

    }
    catch(e) {

        console.log(e);
    }
}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    displayPitch =
        smooth(
            displayPitch,
            targetPitch,
            ATTITUDE_SMOOTHING
        );

    displayRoll =
        smooth(
            displayRoll,
            targetRoll,
            ATTITUDE_SMOOTHING
        );


    if (haveHeading) {

        displayHeading =
            smoothAngle(
                displayHeading,
                rawHeading,
                HEADING_SMOOTHING
            );
    }


    /*
       PFD:

       Nase hoch -> Horizont nach unten

       Roll rechts -> Horizont nach links
       drehen.
    */

    const pitchPixels =
        displayPitch *
        PX_PER_DEG;


    horizon.style.transform =
        `translateY(${pitchPixels}px)
         rotate(${-displayRoll}deg)`;


    pitchValue.textContent =
        displayPitch.toFixed(1) +
        "°";

    rollValue.textContent =
        displayRoll.toFixed(1) +
        "°";


    if (haveHeading) {

        let h =
            Math.round(
                displayHeading
            ) % 360;

        if (h === 0)
            h = 360;

        const text =
            String(h)
            .padStart(3, "0");

        headingValue.textContent =
            text;

        compassValue.textContent =
            text + "°";


        const center =
            document
            .getElementById("headingBox")
            .clientWidth / 2;


        headingTape.style.transform =
            `translateX(${
                center -
                displayHeading *
                HEADING_PX_PER_DEG
            }px)`;
    }


    requestAnimationFrame(render);
}

render();


/* =========================================================
   BUTTONS
   ========================================================= */

startButton.addEventListener(
    "click",
    startSensors
);

zeroButton.addEventListener(
    "click",
    zeroAttitude
);

fullscreenButton.addEventListener(
    "click",
    fullscreen
);

</script>

</body>
</html>
